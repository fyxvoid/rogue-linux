# CogmanII Package Metadata — toybox (Trivial Benchmark)

[identity]
name     = "toybox"
version  = "0.8.11"
category = "base"
summary  = "All-in-one Linux command line"

[identity.source]
kind = "tarball"
file = "toybox-0.8.11.tar.gz"

[identity.depends]
build   = ["toolchain/gcc", "base/glibc"]
runtime = ["base/glibc"]

[builder]
system = "make"

[builder.steps]
commands = [
    "rm -rf source",
    "mkdir -p source",
    "tar -xf /home/rogue/workspace/rogue-linux/tar/toybox-0.8.11.tar.gz -C source",
    "cd source/toybox-0.8.11 && make defconfig"
]

[installer]
steps = [
    "cd source/toybox-0.8.11 && make -j$(nproc)",
    "mkdir -p $PKGROOT/bin",
    "cp source/toybox-0.8.11/toybox $PKGROOT/bin/toybox"
]

[installer.verify]
expected_files = ["bin/toybox"]

[policy.filesystem]
read  = ["/"]
write = ["/bin"]

[policy.network]
outbound = false

[policy]
capabilities = []
