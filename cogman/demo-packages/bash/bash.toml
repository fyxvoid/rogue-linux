[identity]
name = "bash"
version = "5.2.21"
category = "base"
summary = """
GNU Bourne Again SHell interactive shell and scripting language
"""

[identity.source]
kind = "tarball"
file = "bash-5.2.21.tar.xz"

[identity.depends]
build = ["base/ncurses", "base/readline", "toolchain/gcc", "toolchain/glibc"]

[build]
system = "autotools"
steps = ["rm -rf source build", "mkdir -p source build", """
echo "[COGMAN] Extracting bash source, sir."
tar -xf tar/bash-5.2.21.tar.xz -C source
""", """
echo "[COGMAN] Configuring bash, sir."
cd build
../source/bash-5.2.21/configure --prefix=/usr \
  --without-bash-malloc \
  --with-installed-readline
"""]

[installer]
steps = ["""
echo "[COGMAN] Building bash, sir."
cd build
make -j$(nproc)
""", """
echo "[COGMAN] Installing bash into staging root, sir."
cd build
make install DESTDIR="$PKGROOT"
"""]

[policy]

[policy.filesystem]
read = ["/"]
write = ["/usr"]

[policy.network]
outbound = false
capabilities = []
