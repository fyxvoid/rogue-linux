[package]
name = "cogman-planner"
version = "1.0.0"
edition = "2021"
description = "Cogman build planner — TOML metadata to binary execution plan"

[[bin]]
name = "cogman_planner"
path = "main.rs"

[features]
default = []
# Enable optional AI advisory backend (Ollama).
# This adds no runtime cost when AI is not invoked.
# Build with: cargo build --features ai
ai = ["dep:reqwest", "dep:serde_json"]

[dependencies]
toml = "0.8"
serde = { version = "1", features = ["derive"] }
petgraph = "0.6"
clap = { version = "4", features = ["derive"] }
tempfile = "3"
cogman-advisor = { path = "../advisor", optional = true }
reqwest = { version = "0.11", features = ["blocking", "json"], optional = true }
serde_json = { version = "1.0", optional = true }

[profile.release]
opt-level = 3
lto = true
strip = true
