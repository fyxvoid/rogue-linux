[identity]
name    = "busybox"
version = "1.36.1"
category = "base"
summary = "All-in-one embedded Unix utilities (static build)"

[identity.source]
kind = "tarball"
file = "busybox-1.36.1.tar.bz2"

[identity.depends]
build   = ["toolchain/linux-headers"]
runtime = []

[build]
system  = "make"
variant = "native"
steps   = [
    "tar -xf tar/busybox-1.36.1.tar.bz2",
    "make -C busybox-1.36.1 defconfig",
    # Force CONFIG_STATIC=y; disable CONFIG_TC (CBQ structs removed in Linux 6.x headers)
    "sed -i '/CONFIG_STATIC/d; /CONFIG_TC/d' busybox-1.36.1/.config && printf 'CONFIG_STATIC=y\n# CONFIG_TC is not set\n' >> busybox-1.36.1/.config",
    # Reconcile config: pipe empty lines so all NEW option prompts accept their defaults
    "yes '' | make -C busybox-1.36.1 oldconfig",
    "make -C busybox-1.36.1 -j$(nproc) V=0",
]

[installer]
steps = [
    "make -C busybox-1.36.1 CONFIG_PREFIX=$PKGROOT install",
    "mkdir -p $PKGROOT/sbin",
    "test -f $PKGROOT/sbin/init || ln -sf ../bin/busybox $PKGROOT/sbin/init",
]

[installer.verify]
expected_files = [
    "bin/busybox",
    "sbin/init",
]

[policy.filesystem]
read  = ["/"]
write = ["/"]
