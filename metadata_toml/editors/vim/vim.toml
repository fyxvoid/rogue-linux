[identity]
name = "vim"
version = "9.1.0"
category = "editors"
summary = """
Vi Improved text editor with syntax highlighting and scripting
"""

[source]
kind = "tarball"
file = "vim-9.1.0.tar.xz"

[dependencies]
build = ["toolchain/gcc", "base/ncurses", "base/readline"]

[build]
steps = ["rm -rf source build", "mkdir -p source build", """
echo "[COGMAN] Extracting vim source, sir."
tar -xf tar/vim-9.1.0.tar.xz -C source
""", """
echo "[COGMAN] Configuring vim, sir."
cd build
../source/vim-9.1.0/configure --prefix=/usr \
  --with-features=huge \
  --enable-multibyte \
  --enable-python3interp
"""]

[installer]
steps = ["""
echo "[COGMAN] Building vim, sir."
cd build
make -j$(nproc)
""", """
echo "[COGMAN] Installing vim into staging root, sir."
cd build
make install DESTDIR="$PKGROOT"
"""]

[policy]