[identity]
name = "micro"
version = "2.0.13"
category = "editors"
summary = """
Modern intuitive terminal text editor
"""

[source]
kind = "tarball"
file = "micro-2.0.13.tar.xz"

[dependencies]
build = ["scripting/go/go"]

[build]
steps = ["rm -rf source build", "mkdir -p source build", """
echo "[COGMAN] Extracting micro source, sir."
tar -xf tar/micro-2.0.13.tar.xz -C source
""", """
echo "[COGMAN] Building micro with Go, sir."
cd source/micro-2.0.13
go build -o ../../build/ ./...
"""]

[installer]
steps = ["""
echo "[COGMAN] Installing micro, sir."
install -Dm755 build/* "$PKGROOT/usr/bin/"
"""]

[policy]