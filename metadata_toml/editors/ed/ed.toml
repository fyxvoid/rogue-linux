[identity]
name = "ed"
version = "1.20.1"
category = "editors"
summary = """
GNU Ed line-oriented text editor
"""

[source]
kind = "tarball"
file = "ed-1.20.1.tar.xz"

[dependencies]
build = ["toolchain/gcc"]

[build]
steps = ["rm -rf source build", "mkdir -p source build", """
echo "[COGMAN] Extracting ed source, sir."
tar -xf tar/ed-1.20.1.tar.xz -C source
""", """
echo "[COGMAN] Configuring ed, sir."
cd build
../source/ed-1.20.1/configure --prefix=/usr \
  
"""]

[installer]
steps = ["""
echo "[COGMAN] Building ed, sir."
cd build
make -j$(nproc)
""", """
echo "[COGMAN] Installing ed into staging root, sir."
cd build
make install DESTDIR="$PKGROOT"
"""]

[policy]