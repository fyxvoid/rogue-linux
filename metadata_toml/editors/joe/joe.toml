[identity]
name = "joe"
version = "4.6"
category = "editors"
summary = """
Joes Own Editor terminal text editor with WordStar keybindings
"""

[source]
kind = "tarball"
file = "joe-4.6.tar.xz"

[dependencies]
build = ["toolchain/gcc", "base/ncurses"]

[build]
steps = ["rm -rf source build", "mkdir -p source build", """
echo "[COGMAN] Extracting joe source, sir."
tar -xf tar/joe-4.6.tar.xz -C source
""", """
echo "[COGMAN] Configuring joe, sir."
cd build
../source/joe-4.6/configure --prefix=/usr \
  --sysconfdir=/etc
"""]

[installer]
steps = ["""
echo "[COGMAN] Building joe, sir."
cd build
make -j$(nproc)
""", """
echo "[COGMAN] Installing joe into staging root, sir."
cd build
make install DESTDIR="$PKGROOT"
"""]

[policy]