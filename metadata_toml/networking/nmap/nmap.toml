[identity]
name = "nmap"
version = "7.98"
category = "networking"
description = """
Network exploration and security auditing tool. Provides port scanning, service detection, OS fingerprinting, and scripting via NSE.
"""

[build]
steps = ["""
echo "[COGMAN] Extracting nmap source, sir."
tar -xf tar/nmap-7.98.tar.bz2 -C source --strip-components=1
""", """
echo "[COGMAN] Configuring nmap, sir."
cd source
./configure \
  --prefix=/usr \
  --with-libpcap=yes \
  --with-openssl=yes \
  --with-libnl=yes
""", """
echo "[COGMAN] Building nmap, sir."
cd source
make
"""]

[installer]
steps = ["""
echo "[COGMAN] Installing nmap into pkgroot, sir."
cd source
make install DESTDIR="$PKGROOT"
"""]

[policy]