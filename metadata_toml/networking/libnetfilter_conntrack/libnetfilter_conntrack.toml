[identity]
name = "libnetfilter_conntrack"
version = "1.0.9"
category = "networking"
description = """
Userspace library providing an API to the kernel connection tracking subsystem via netlink. Required for conntrack-based tools and advanced packet inspection.
"""

[build]
steps = ["""
echo "[COGMAN] Extracting libnetfilter_conntrack source, sir."
tar -xf tar/libnetfilter_conntrack-1.0.9.tar.bz2 -C source --strip-components=1
""", """
echo "[COGMAN] Configuring libnetfilter_conntrack, sir."
cd source
./configure \
  --prefix=/usr \
  --disable-static
""", """
echo "[COGMAN] Building libnetfilter_conntrack, sir."
cd source
make
"""]

[installer]
steps = ["""
echo "[COGMAN] Installing libnetfilter_conntrack into pkgroot, sir."
cd source
make install DESTDIR="$PKGROOT"
"""]

[policy]