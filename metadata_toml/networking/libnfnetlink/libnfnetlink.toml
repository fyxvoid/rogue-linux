[identity]
name = "libnfnetlink"
version = "1.0.2"
category = "networking"
description = """
Low-level library for netfilter netlink communication. Required by conntrack, nftables, and packet inspection tools.
"""

[build]
steps = ["""
echo "[COGMAN] Extracting libnfnetlink source, sir."
tar -xf tar/libnfnetlink-1.0.2.tar -C source --strip-components=1
""", """
echo "[COGMAN] Configuring libnfnetlink, sir."
cd source
./configure \
  --prefix=/usr \
  --disable-static
""", """
echo "[COGMAN] Building libnfnetlink, sir."
cd source
make
"""]

[installer]
steps = ["""
echo "[COGMAN] Installing libnfnetlink into pkgroot, sir."
cd source
make install DESTDIR="$PKGROOT"
"""]

[policy]