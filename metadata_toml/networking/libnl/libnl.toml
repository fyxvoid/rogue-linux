[identity]
name = "libnl"
version = "3.9.0"
category = "networking"
description = """
Netlink protocol library suite providing APIs to communicate with the Linux kernel networking subsystem. Required by iproute2 and many advanced networking tools.
"""

[build]
steps = ["""
echo "[COGMAN] Extracting libnl source, sir."
tar -xf tar/libnl-3.9.0.tar.gz -C source --strip-components=1
""", """
echo "[COGMAN] Configuring libnl, sir."
cd source
./configure \
  --prefix=/usr \
  --sysconfdir=/etc \
  --disable-static
""", """
echo "[COGMAN] Building libnl, sir."
cd source
make
"""]

[installer]
steps = ["""
echo "[COGMAN] Installing libnl into pkgroot, sir."
cd source
make install DESTDIR="$PKGROOT"
"""]

[policy]