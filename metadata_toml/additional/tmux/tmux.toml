[identity]
name = "tmux"
version = "3.4"
category = "additional"
summary = """
Terminal multiplexer for managing multiple terminal sessions
"""

[source]
kind = "tarball"
file = "tmux-3.4.tar.xz"

[dependencies]
build = ["toolchain/gcc", "base/ncurses", "libs/general/libevent"]

[build]
steps = ["rm -rf source build", "mkdir -p source build", """
echo "[COGMAN] Extracting tmux source, sir."
tar -xf tar/tmux-3.4.tar.xz -C source
""", """
echo "[COGMAN] Configuring tmux, sir."
cd build
../source/tmux-3.4/configure --prefix=/usr \
  
"""]

[installer]
steps = ["""
echo "[COGMAN] Building tmux, sir."
cd build
make -j$(nproc)
""", """
echo "[COGMAN] Installing tmux into staging root, sir."
cd build
make install DESTDIR="$PKGROOT"
"""]

[policy]