[identity]
name = "zoxide"
version = "0.9.4"
category = "additional"
summary = """
Smarter cd command that learns your habits
"""

[source]
kind = "tarball"
file = "zoxide-0.9.4.tar.xz"

[dependencies]
build = ["scripting/rust/rust"]

[build]
steps = ["rm -rf source build", "mkdir -p source build", """
echo "[COGMAN] Extracting zoxide source, sir."
tar -xf tar/zoxide-0.9.4.tar.xz -C source
""", """
echo "[COGMAN] Building zoxide with Cargo, sir."
cd source/zoxide-0.9.4
cargo build --release
"""]

[installer]
steps = ["""
echo "[COGMAN] Installing zoxide, sir."
cd source/zoxide*
install -Dm755 target/release/{name} "$PKGROOT/usr/bin/"
"""]

[policy]