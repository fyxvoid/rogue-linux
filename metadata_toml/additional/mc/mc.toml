[identity]
name = "mc"
version = "4.8.31"
category = "additional"
summary = """
Midnight Commander visual file manager for terminal
"""

[source]
kind = "tarball"
file = "mc-4.8.31.tar.xz"

[dependencies]
build = ["toolchain/gcc", "libs/general/glib", "base/ncurses"]

[build]
steps = ["rm -rf source build", "mkdir -p source build", """
echo "[COGMAN] Extracting mc source, sir."
tar -xf tar/mc-4.8.31.tar.xz -C source
""", """
echo "[COGMAN] Configuring mc, sir."
cd build
../source/mc-4.8.31/configure --prefix=/usr \
  --sysconfdir=/etc
"""]

[installer]
steps = ["""
echo "[COGMAN] Building mc, sir."
cd build
make -j$(nproc)
""", """
echo "[COGMAN] Installing mc into staging root, sir."
cd build
make install DESTDIR="$PKGROOT"
"""]

[policy]