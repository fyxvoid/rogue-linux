[identity]
name = "p7zip"
version = "17.05"
category = "additional"
summary = """
7-Zip file archiver with high compression ratio
"""

[source]
kind = "tarball"
file = "p7zip-17.05.tar.xz"

[dependencies]
build = ["toolchain/gcc"]

[build]
steps = ["rm -rf source build", "mkdir -p source build", """
echo "[COGMAN] Extracting p7zip source, sir."
tar -xf tar/p7zip-17.05.tar.xz -C source
""", """
echo "[COGMAN] Building p7zip, sir."
cd source/p7zip-17.05
make -j$(nproc)
"""]

[installer]
steps = ["""
echo "[COGMAN] Building p7zip, sir."
cd build
make -j$(nproc)
""", """
echo "[COGMAN] Installing p7zip into staging root, sir."
cd build
make install DESTDIR="$PKGROOT"
"""]

[policy]