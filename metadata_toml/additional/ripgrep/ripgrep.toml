[identity]
name = "ripgrep"
version = "14.1.0"
category = "additional"
summary = """
Line-oriented search tool recursively searching directories
"""

[source]
kind = "tarball"
file = "ripgrep-14.1.0.tar.xz"

[dependencies]
build = ["scripting/rust/rust"]

[build]
steps = ["rm -rf source build", "mkdir -p source build", """
echo "[COGMAN] Extracting ripgrep source, sir."
tar -xf tar/ripgrep-14.1.0.tar.xz -C source
""", """
echo "[COGMAN] Building ripgrep with Cargo, sir."
cd source/ripgrep-14.1.0
cargo build --release
"""]

[installer]
steps = ["""
echo "[COGMAN] Installing ripgrep, sir."
cd source/ripgrep*
install -Dm755 target/release/{name} "$PKGROOT/usr/bin/"
"""]

[policy]