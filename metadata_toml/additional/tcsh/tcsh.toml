[identity]
name = "tcsh"
version = "6.24.10"
category = "additional"
summary = """
Enhanced C shell with programmable command-line completion
"""

[source]
kind = "tarball"
file = "tcsh-6.24.10.tar.xz"

[dependencies]
build = ["toolchain/gcc", "base/ncurses"]

[build]
steps = ["rm -rf source build", "mkdir -p source build", """
echo "[COGMAN] Extracting tcsh source, sir."
tar -xf tar/tcsh-6.24.10.tar.xz -C source
""", """
echo "[COGMAN] Configuring tcsh, sir."
cd build
../source/tcsh-6.24.10/configure --prefix=/usr \
  
"""]

[installer]
steps = ["""
echo "[COGMAN] Building tcsh, sir."
cd build
make -j$(nproc)
""", """
echo "[COGMAN] Installing tcsh into staging root, sir."
cd build
make install DESTDIR="$PKGROOT"
"""]

[policy]