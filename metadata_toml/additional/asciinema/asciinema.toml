[identity]
name = "asciinema"
version = "2.4.0"
category = "additional"
summary = """
Terminal session recorder for creating shareable recordings
"""

[source]
kind = "tarball"
file = "asciinema-2.4.0.tar.xz"

[dependencies]
build = ["scripting/python/python3"]

[build]
steps = ["rm -rf source build", "mkdir -p source build", """
echo "[COGMAN] Extracting asciinema source, sir."
tar -xf tar/asciinema-2.4.0.tar.xz -C source
""", """
echo "[COGMAN] Building asciinema Python package, sir."
cd source/asciinema-2.4.0
python3 setup.py build
"""]

[installer]
steps = ["""
echo "[COGMAN] Installing asciinema Python package, sir."
cd source/asciinema*
python3 setup.py install --root="$PKGROOT" --prefix=/usr
"""]

[policy]