[identity]
name = "byobu"
version = "5.133"
category = "additional"
summary = """
Text-based window manager and terminal multiplexer enhancement
"""

[source]
kind = "tarball"
file = "byobu-5.133.tar.xz"

[dependencies]
build = ["base/bash", "additional/tmux"]

[build]
steps = ["rm -rf source build", "mkdir -p source build", """
echo "[COGMAN] Extracting byobu source, sir."
tar -xf tar/byobu-5.133.tar.xz -C source
""", """
echo "[COGMAN] Building byobu, sir."
cd source/byobu-5.133
make -j$(nproc)
"""]

[installer]
steps = ["""
echo "[COGMAN] Building byobu, sir."
cd build
make -j$(nproc)
""", """
echo "[COGMAN] Installing byobu into staging root, sir."
cd build
make install DESTDIR="$PKGROOT"
"""]

[policy]