[identity]
name = "zsh"
version = "5.9"
category = "additional"
summary = """
Z shell with advanced completion and scripting features
"""

[source]
kind = "tarball"
file = "zsh-5.9.tar.xz"

[dependencies]
build = ["toolchain/gcc", "base/ncurses", "base/readline"]

[build]
steps = ["rm -rf source build", "mkdir -p source build", """
echo "[COGMAN] Extracting zsh source, sir."
tar -xf tar/zsh-5.9.tar.xz -C source
""", """
echo "[COGMAN] Configuring zsh, sir."
cd build
../source/zsh-5.9/configure --prefix=/usr \
  --enable-multibyte \
  --enable-pcre
"""]

[installer]
steps = ["""
echo "[COGMAN] Building zsh, sir."
cd build
make -j$(nproc)
""", """
echo "[COGMAN] Installing zsh into staging root, sir."
cd build
make install DESTDIR="$PKGROOT"
"""]

[policy]