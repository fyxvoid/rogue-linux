[identity]
name = "procs"
version = "0.14.4"
category = "additional"
summary = """
Modern replacement for ps written in Rust
"""

[source]
kind = "tarball"
file = "procs-0.14.4.tar.xz"

[dependencies]
build = ["scripting/rust/rust"]

[build]
steps = ["rm -rf source build", "mkdir -p source build", """
echo "[COGMAN] Extracting procs source, sir."
tar -xf tar/procs-0.14.4.tar.xz -C source
""", """
echo "[COGMAN] Building procs with Cargo, sir."
cd source/procs-0.14.4
cargo build --release
"""]

[installer]
steps = ["""
echo "[COGMAN] Installing procs, sir."
cd source/procs*
install -Dm755 target/release/{name} "$PKGROOT/usr/bin/"
"""]

[policy]