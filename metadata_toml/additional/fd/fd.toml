[identity]
name = "fd"
version = "9.0.0"
category = "additional"
summary = """
Simple fast user-friendly alternative to find
"""

[source]
kind = "tarball"
file = "fd-9.0.0.tar.xz"

[dependencies]
build = ["scripting/rust/rust"]

[build]
steps = ["rm -rf source build", "mkdir -p source build", """
echo "[COGMAN] Extracting fd source, sir."
tar -xf tar/fd-9.0.0.tar.xz -C source
""", """
echo "[COGMAN] Building fd with Cargo, sir."
cd source/fd-9.0.0
cargo build --release
"""]

[installer]
steps = ["""
echo "[COGMAN] Installing fd, sir."
cd source/fd*
install -Dm755 target/release/{name} "$PKGROOT/usr/bin/"
"""]

[policy]