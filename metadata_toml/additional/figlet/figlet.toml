[identity]
name = "figlet"
version = "2.2.5"
category = "additional"
summary = """
Program for making large ASCII art text banners
"""

[source]
kind = "tarball"
file = "figlet-2.2.5.tar.xz"

[dependencies]
build = ["toolchain/gcc"]

[build]
steps = ["rm -rf source build", "mkdir -p source build", """
echo "[COGMAN] Extracting figlet source, sir."
tar -xf tar/figlet-2.2.5.tar.xz -C source
""", """
echo "[COGMAN] Building figlet, sir."
cd source/figlet-2.2.5
make -j$(nproc)
"""]

[installer]
steps = ["""
echo "[COGMAN] Building figlet, sir."
cd build
make -j$(nproc)
""", """
echo "[COGMAN] Installing figlet into staging root, sir."
cd build
make install DESTDIR="$PKGROOT"
"""]

[policy]