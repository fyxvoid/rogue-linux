[identity]
name = "tokei"
version = "12.1.2"
category = "additional"
summary = """
Count code lines statistics quickly across languages
"""

[source]
kind = "tarball"
file = "tokei-12.1.2.tar.xz"

[dependencies]
build = ["scripting/rust/rust"]

[build]
steps = ["rm -rf source build", "mkdir -p source build", """
echo "[COGMAN] Extracting tokei source, sir."
tar -xf tar/tokei-12.1.2.tar.xz -C source
""", """
echo "[COGMAN] Building tokei with Cargo, sir."
cd source/tokei-12.1.2
cargo build --release
"""]

[installer]
steps = ["""
echo "[COGMAN] Installing tokei, sir."
cd source/tokei*
install -Dm755 target/release/{name} "$PKGROOT/usr/bin/"
"""]

[policy]