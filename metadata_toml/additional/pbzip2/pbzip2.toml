[identity]
name = "pbzip2"
version = "1.1.13"
category = "additional"
summary = """
Parallel bzip2 compression using pthreads
"""

[source]
kind = "tarball"
file = "pbzip2-1.1.13.tar.xz"

[dependencies]
build = ["toolchain/gcc", "libs/compression/bzip2"]

[build]
steps = ["rm -rf source build", "mkdir -p source build", """
echo "[COGMAN] Extracting pbzip2 source, sir."
tar -xf tar/pbzip2-1.1.13.tar.xz -C source
""", """
echo "[COGMAN] Building pbzip2, sir."
cd source/pbzip2-1.1.13
make -j$(nproc)
"""]

[installer]
steps = ["""
echo "[COGMAN] Building pbzip2, sir."
cd build
make -j$(nproc)
""", """
echo "[COGMAN] Installing pbzip2 into staging root, sir."
cd build
make install DESTDIR="$PKGROOT"
"""]

[policy]