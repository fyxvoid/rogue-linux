[identity]
name = "git"
version = "2.44.0"
category = "additional"
summary = """
Distributed version control system for source code management
"""

[source]
kind = "tarball"
file = "git-2.44.0.tar.xz"

[dependencies]
build = ["toolchain/gcc", "libs/general/curl", "libs/crypto/openssl", "libs/compression/zlib", "base/expat"]

[build]
steps = ["rm -rf source build", "mkdir -p source build", """
echo "[COGMAN] Extracting git source, sir."
tar -xf tar/git-2.44.0.tar.xz -C source
""", """
echo "[COGMAN] Configuring git, sir."
cd build
../source/git-2.44.0/configure --prefix=/usr \
  
"""]

[installer]
steps = ["""
echo "[COGMAN] Building git, sir."
cd build
make -j$(nproc)
""", """
echo "[COGMAN] Installing git into staging root, sir."
cd build
make install DESTDIR="$PKGROOT"
"""]

[policy]