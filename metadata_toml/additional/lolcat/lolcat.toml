[identity]
name = "lolcat"
version = "100.0.1"
category = "additional"
summary = """
Rainbow coloring for terminal output
"""

[source]
kind = "tarball"
file = "lolcat-100.0.1.tar.xz"

[dependencies]
build = ["scripting/ruby/ruby"]

[build]
steps = ["rm -rf source build", "mkdir -p source build", """
echo "[COGMAN] Extracting lolcat source, sir."
tar -xf tar/lolcat-100.0.1.tar.xz -C source
""", """
echo "[COGMAN] Building lolcat, sir."
cd source/lolcat-100.0.1
make -j$(nproc)
"""]

[installer]
steps = ["""
echo "[COGMAN] Building lolcat, sir."
cd build
make -j$(nproc)
""", """
echo "[COGMAN] Installing lolcat into staging root, sir."
cd build
make install DESTDIR="$PKGROOT"
"""]

[policy]