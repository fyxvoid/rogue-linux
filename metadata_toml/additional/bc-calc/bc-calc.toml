[identity]
name = "bc-calc"
version = "6.7.5"
category = "additional"
summary = """
Arbitrary precision calculator language and library
"""

[source]
kind = "tarball"
file = "bc-calc-6.7.5.tar.xz"

[dependencies]
build = ["toolchain/gcc"]

[build]
steps = ["rm -rf source build", "mkdir -p source build", """
echo "[COGMAN] Extracting bc-calc source, sir."
tar -xf tar/bc-calc-6.7.5.tar.xz -C source
""", """
echo "[COGMAN] Configuring bc-calc, sir."
cd build
../source/bc-calc-6.7.5/configure --prefix=/usr \
  
"""]

[installer]
steps = ["""
echo "[COGMAN] Building bc-calc, sir."
cd build
make -j$(nproc)
""", """
echo "[COGMAN] Installing bc-calc into staging root, sir."
cd build
make install DESTDIR="$PKGROOT"
"""]

[policy]