[identity]
name = "nushell"
version = "0.90.1"
category = "additional"
summary = """
Modern shell with structured data support
"""

[source]
kind = "tarball"
file = "nushell-0.90.1.tar.xz"

[dependencies]
build = ["scripting/rust/rust"]

[build]
steps = ["rm -rf source build", "mkdir -p source build", """
echo "[COGMAN] Extracting nushell source, sir."
tar -xf tar/nushell-0.90.1.tar.xz -C source
""", """
echo "[COGMAN] Building nushell with Cargo, sir."
cd source/nushell-0.90.1
cargo build --release
"""]

[installer]
steps = ["""
echo "[COGMAN] Installing nushell, sir."
cd source/nushell*
install -Dm755 target/release/{name} "$PKGROOT/usr/bin/"
"""]

[policy]