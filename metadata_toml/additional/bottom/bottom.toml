[identity]
name = "bottom"
version = "0.9.6"
category = "additional"
summary = """
Cross-platform graphical process and system monitor
"""

[source]
kind = "tarball"
file = "bottom-0.9.6.tar.xz"

[dependencies]
build = ["scripting/rust/rust"]

[build]
steps = ["rm -rf source build", "mkdir -p source build", """
echo "[COGMAN] Extracting bottom source, sir."
tar -xf tar/bottom-0.9.6.tar.xz -C source
""", """
echo "[COGMAN] Building bottom with Cargo, sir."
cd source/bottom-0.9.6
cargo build --release
"""]

[installer]
steps = ["""
echo "[COGMAN] Installing bottom, sir."
cd source/bottom*
install -Dm755 target/release/{name} "$PKGROOT/usr/bin/"
"""]

[policy]