[identity]
name = "tree"
version = "2.1.1"
category = "additional"
summary = """
List contents of directories in a tree-like format
"""

[source]
kind = "tarball"
file = "tree-2.1.1.tar.xz"

[dependencies]
build = ["toolchain/gcc"]

[build]
steps = ["rm -rf source build", "mkdir -p source build", """
echo "[COGMAN] Extracting tree source, sir."
tar -xf tar/tree-2.1.1.tar.xz -C source
""", """
echo "[COGMAN] Building tree, sir."
cd source/tree-2.1.1
make -j$(nproc)
"""]

[installer]
steps = ["""
echo "[COGMAN] Building tree, sir."
cd build
make -j$(nproc)
""", """
echo "[COGMAN] Installing tree into staging root, sir."
cd build
make install DESTDIR="$PKGROOT"
"""]

[policy]