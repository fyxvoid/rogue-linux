[identity]
name = "starship"
version = "1.17.1"
category = "additional"
summary = """
Minimal fast cross-shell prompt
"""

[source]
kind = "tarball"
file = "starship-1.17.1.tar.xz"

[dependencies]
build = ["scripting/rust/rust"]

[build]
steps = ["rm -rf source build", "mkdir -p source build", """
echo "[COGMAN] Extracting starship source, sir."
tar -xf tar/starship-1.17.1.tar.xz -C source
""", """
echo "[COGMAN] Building starship with Cargo, sir."
cd source/starship-1.17.1
cargo build --release
"""]

[installer]
steps = ["""
echo "[COGMAN] Installing starship, sir."
cd source/starship*
install -Dm755 target/release/{name} "$PKGROOT/usr/bin/"
"""]

[policy]