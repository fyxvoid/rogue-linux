[identity]
name = "ranger"
version = "1.9.3"
category = "additional"
summary = """
Console file manager with VI key bindings
"""

[source]
kind = "tarball"
file = "ranger-1.9.3.tar.xz"

[dependencies]
build = ["scripting/python/python3"]

[build]
steps = ["rm -rf source build", "mkdir -p source build", """
echo "[COGMAN] Extracting ranger source, sir."
tar -xf tar/ranger-1.9.3.tar.xz -C source
""", """
echo "[COGMAN] Building ranger Python package, sir."
cd source/ranger-1.9.3
python3 setup.py build
"""]

[installer]
steps = ["""
echo "[COGMAN] Installing ranger Python package, sir."
cd source/ranger*
python3 setup.py install --root="$PKGROOT" --prefix=/usr
"""]

[policy]