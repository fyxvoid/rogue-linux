[identity]
name = "ncdu"
version = "2.3"
category = "additional"
summary = """
NCurses Disk Usage analyzer with fast scanning
"""

[source]
kind = "tarball"
file = "ncdu-2.3.tar.xz"

[dependencies]
build = ["scripting/rust/rust"]

[build]
steps = ["rm -rf source build", "mkdir -p source build", """
echo "[COGMAN] Extracting ncdu source, sir."
tar -xf tar/ncdu-2.3.tar.xz -C source
""", """
echo "[COGMAN] Building ncdu with Cargo, sir."
cd source/ncdu-2.3
cargo build --release
"""]

[installer]
steps = ["""
echo "[COGMAN] Installing ncdu, sir."
cd source/ncdu*
install -Dm755 target/release/{name} "$PKGROOT/usr/bin/"
"""]

[policy]