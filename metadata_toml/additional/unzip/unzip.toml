[identity]
name = "unzip"
version = "6.0"
category = "additional"
summary = """
Extraction utility for ZIP archives
"""

[source]
kind = "tarball"
file = "unzip-6.0.tar.xz"

[dependencies]
build = ["toolchain/gcc"]

[build]
steps = ["rm -rf source build", "mkdir -p source build", """
echo "[COGMAN] Extracting unzip source, sir."
tar -xf tar/unzip-6.0.tar.xz -C source
""", """
echo "[COGMAN] Building unzip, sir."
cd source/unzip-6.0
make -j$(nproc)
"""]

[installer]
steps = ["""
echo "[COGMAN] Building unzip, sir."
cd build
make -j$(nproc)
""", """
echo "[COGMAN] Installing unzip into staging root, sir."
cd build
make install DESTDIR="$PKGROOT"
"""]

[policy]