[identity]
name = "acpid"
version = "2.0.34"
category = "system"
summary = """
Advanced Configuration and Power Interface event daemon
"""

[source]
kind = "tarball"
file = "acpid-2.0.34.tar.xz"

[dependencies]
build = ["toolchain/gcc"]

[build]
steps = ["rm -rf source build", "mkdir -p source build", """
echo "[COGMAN] Extracting acpid source, sir."
tar -xf tar/acpid-2.0.34.tar.xz -C source
""", """
echo "[COGMAN] Configuring acpid, sir."
cd build
../source/acpid-2.0.34/configure --prefix=/usr \
  
"""]

[installer]
steps = ["""
echo "[COGMAN] Building acpid, sir."
cd build
make -j$(nproc)
""", """
echo "[COGMAN] Installing acpid into staging root, sir."
cd build
make install DESTDIR="$PKGROOT"
"""]

[policy]