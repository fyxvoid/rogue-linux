[identity]
name = "iotop"
version = "0.6"
category = "system"
summary = """
I/O monitoring tool for Linux showing per-process disk usage
"""

[source]
kind = "tarball"
file = "iotop-0.6.tar.xz"

[dependencies]
build = ["scripting/python/python3"]

[build]
steps = ["rm -rf source build", "mkdir -p source build", """
echo "[COGMAN] Extracting iotop source, sir."
tar -xf tar/iotop-0.6.tar.xz -C source
""", """
echo "[COGMAN] Building iotop Python package, sir."
cd source/iotop-0.6
python3 setup.py build
"""]

[installer]
steps = ["""
echo "[COGMAN] Installing iotop Python package, sir."
cd source/iotop*
python3 setup.py install --root="$PKGROOT" --prefix=/usr
"""]

[policy]