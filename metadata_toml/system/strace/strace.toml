[identity]
name = "strace"
version = "6.7"
category = "system"
summary = """
System call tracer for debugging and diagnostic purposes
"""

[source]
kind = "tarball"
file = "strace-6.7.tar.xz"

[dependencies]
build = ["toolchain/gcc", "base/libelf"]

[build]
steps = ["rm -rf source build", "mkdir -p source build", """
echo "[COGMAN] Extracting strace source, sir."
tar -xf tar/strace-6.7.tar.xz -C source
""", """
echo "[COGMAN] Configuring strace, sir."
cd build
../source/strace-6.7/configure --prefix=/usr \
  
"""]

[installer]
steps = ["""
echo "[COGMAN] Building strace, sir."
cd build
make -j$(nproc)
""", """
echo "[COGMAN] Installing strace into staging root, sir."
cd build
make install DESTDIR="$PKGROOT"
"""]

[policy]