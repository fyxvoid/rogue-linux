[identity]
name = "lvm2"
version = "2.03.23"
category = "system"
summary = """
Logical Volume Manager utilities for flexible disk management
"""

[source]
kind = "tarball"
file = "lvm2-2.03.23.tar.xz"

[dependencies]
build = ["toolchain/gcc", "base/util-linux"]

[build]
steps = ["rm -rf source build", "mkdir -p source build", """
echo "[COGMAN] Extracting lvm2 source, sir."
tar -xf tar/lvm2-2.03.23.tar.xz -C source
""", """
echo "[COGMAN] Configuring lvm2, sir."
cd build
../source/lvm2-2.03.23/configure --prefix=/usr \
  --enable-cmdlib \
  --enable-pkgconfig
"""]

[installer]
steps = ["""
echo "[COGMAN] Building lvm2, sir."
cd build
make -j$(nproc)
""", """
echo "[COGMAN] Installing lvm2 into staging root, sir."
cd build
make install DESTDIR="$PKGROOT"
"""]

[policy]