[identity]
name = "fuse"
version = "3.16.2"
category = "system"
summary = """
Filesystem in Userspace framework for custom filesystems
"""

[source]
kind = "tarball"
file = "fuse-3.16.2.tar.xz"

[dependencies]
build = ["toolchain/gcc"]

[build]
steps = ["rm -rf source build", "mkdir -p source build", """
echo "[COGMAN] Extracting fuse source, sir."
tar -xf tar/fuse-3.16.2.tar.xz -C source
""", """
echo "[COGMAN] Configuring fuse with Meson, sir."
cd build
meson setup ../source/fuse-3.16.2 . --prefix=/usr --buildtype=release
"""]

[installer]
steps = ["""
echo "[COGMAN] Building fuse, sir."
cd build
ninja
""", """
echo "[COGMAN] Installing fuse into staging root, sir."
cd build
DESTDIR="$PKGROOT" ninja install
"""]

[policy]