[identity]
name = "gdisk"
version = "1.0.10"
category = "system"
summary = """
GPT fdisk partitioning tools for GUID partition tables
"""

[source]
kind = "tarball"
file = "gdisk-1.0.10.tar.xz"

[dependencies]
build = ["toolchain/gcc", "base/ncurses"]

[build]
steps = ["rm -rf source build", "mkdir -p source build", """
echo "[COGMAN] Extracting gdisk source, sir."
tar -xf tar/gdisk-1.0.10.tar.xz -C source
""", """
echo "[COGMAN] Building gdisk, sir."
cd source/gdisk-1.0.10
make -j$(nproc)
"""]

[installer]
steps = ["""
echo "[COGMAN] Building gdisk, sir."
cd build
make -j$(nproc)
""", """
echo "[COGMAN] Installing gdisk into staging root, sir."
cd build
make install DESTDIR="$PKGROOT"
"""]

[policy]