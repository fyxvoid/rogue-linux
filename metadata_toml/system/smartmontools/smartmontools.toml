[identity]
name = "smartmontools"
version = "7.4"
category = "system"
summary = """
SMART disk monitoring and diagnostics tools
"""

[source]
kind = "tarball"
file = "smartmontools-7.4.tar.xz"

[dependencies]
build = ["toolchain/gcc"]

[build]
steps = ["rm -rf source build", "mkdir -p source build", """
echo "[COGMAN] Extracting smartmontools source, sir."
tar -xf tar/smartmontools-7.4.tar.xz -C source
""", """
echo "[COGMAN] Configuring smartmontools, sir."
cd build
../source/smartmontools-7.4/configure --prefix=/usr \
  --sysconfdir=/etc
"""]

[installer]
steps = ["""
echo "[COGMAN] Building smartmontools, sir."
cd build
make -j$(nproc)
""", """
echo "[COGMAN] Installing smartmontools into staging root, sir."
cd build
make install DESTDIR="$PKGROOT"
"""]

[policy]