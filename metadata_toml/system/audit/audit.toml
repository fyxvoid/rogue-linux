[identity]
name = "audit"
version = "3.1.4"
category = "system"
summary = """
Linux Audit Framework for security event monitoring
"""

[source]
kind = "tarball"
file = "audit-3.1.4.tar.xz"

[dependencies]
build = ["toolchain/gcc", "base/linux-pam"]

[build]
steps = ["rm -rf source build", "mkdir -p source build", """
echo "[COGMAN] Extracting audit source, sir."
tar -xf tar/audit-3.1.4.tar.xz -C source
""", """
echo "[COGMAN] Configuring audit, sir."
cd build
../source/audit-3.1.4/configure --prefix=/usr \
  --sysconfdir=/etc
"""]

[installer]
steps = ["""
echo "[COGMAN] Building audit, sir."
cd build
make -j$(nproc)
""", """
echo "[COGMAN] Installing audit into staging root, sir."
cd build
make install DESTDIR="$PKGROOT"
"""]

[policy]