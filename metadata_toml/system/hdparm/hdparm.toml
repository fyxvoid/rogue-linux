[identity]
name = "hdparm"
version = "9.65"
category = "system"
summary = """
Hard disk parameter tuning utility
"""

[source]
kind = "tarball"
file = "hdparm-9.65.tar.xz"

[dependencies]
build = ["toolchain/gcc"]

[build]
steps = ["rm -rf source build", "mkdir -p source build", """
echo "[COGMAN] Extracting hdparm source, sir."
tar -xf tar/hdparm-9.65.tar.xz -C source
""", """
echo "[COGMAN] Building hdparm, sir."
cd source/hdparm-9.65
make -j$(nproc) prefix=/usr
"""]

[installer]
steps = ["""
echo "[COGMAN] Building hdparm, sir."
cd build
make -j$(nproc)
""", """
echo "[COGMAN] Installing hdparm into staging root, sir."
cd build
make install DESTDIR="$PKGROOT"
"""]

[policy]