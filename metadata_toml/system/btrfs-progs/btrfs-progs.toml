[identity]
name = "btrfs-progs"
version = "6.7.1"
category = "system"
summary = """
Btrfs filesystem utilities for administration and repair
"""

[source]
kind = "tarball"
file = "btrfs-progs-6.7.1.tar.xz"

[dependencies]
build = ["toolchain/gcc", "base/e2fsprogs", "libs/compression/zlib", "libs/compression/lz4", "libs/compression/zstd"]

[build]
steps = ["rm -rf source build", "mkdir -p source build", """
echo "[COGMAN] Extracting btrfs-progs source, sir."
tar -xf tar/btrfs-progs-6.7.1.tar.xz -C source
""", """
echo "[COGMAN] Configuring btrfs-progs, sir."
cd build
../source/btrfs-progs-6.7.1/configure --prefix=/usr \
  
"""]

[installer]
steps = ["""
echo "[COGMAN] Building btrfs-progs, sir."
cd build
make -j$(nproc)
""", """
echo "[COGMAN] Installing btrfs-progs into staging root, sir."
cd build
make install DESTDIR="$PKGROOT"
"""]

[policy]