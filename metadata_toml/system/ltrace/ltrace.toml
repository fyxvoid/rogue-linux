[identity]
name = "ltrace"
version = "0.7.3"
category = "system"
summary = """
Library call tracer for dynamic library debugging
"""

[source]
kind = "tarball"
file = "ltrace-0.7.3.tar.xz"

[dependencies]
build = ["toolchain/gcc", "base/libelf"]

[build]
steps = ["rm -rf source build", "mkdir -p source build", """
echo "[COGMAN] Extracting ltrace source, sir."
tar -xf tar/ltrace-0.7.3.tar.xz -C source
""", """
echo "[COGMAN] Configuring ltrace, sir."
cd build
../source/ltrace-0.7.3/configure --prefix=/usr \
  
"""]

[installer]
steps = ["""
echo "[COGMAN] Building ltrace, sir."
cd build
make -j$(nproc)
""", """
echo "[COGMAN] Installing ltrace into staging root, sir."
cd build
make install DESTDIR="$PKGROOT"
"""]

[policy]