[identity]
name = "mdadm"
version = "4.3"
category = "system"
summary = """
Software RAID administration tool for Linux
"""

[source]
kind = "tarball"
file = "mdadm-4.3.tar.xz"

[dependencies]
build = ["toolchain/gcc"]

[build]
steps = ["rm -rf source build", "mkdir -p source build", """
echo "[COGMAN] Extracting mdadm source, sir."
tar -xf tar/mdadm-4.3.tar.xz -C source
""", """
echo "[COGMAN] Building mdadm, sir."
cd source/mdadm-4.3
make -j$(nproc)
"""]

[installer]
steps = ["""
echo "[COGMAN] Building mdadm, sir."
cd build
make -j$(nproc)
""", """
echo "[COGMAN] Installing mdadm into staging root, sir."
cd build
make install DESTDIR="$PKGROOT"
"""]

[policy]