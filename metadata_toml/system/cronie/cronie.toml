[identity]
name = "cronie"
version = "1.7.1"
category = "system"
summary = """
Cron daemon for periodic task scheduling
"""

[source]
kind = "tarball"
file = "cronie-1.7.1.tar.xz"

[dependencies]
build = ["toolchain/gcc", "base/linux-pam"]

[build]
steps = ["rm -rf source build", "mkdir -p source build", """
echo "[COGMAN] Extracting cronie source, sir."
tar -xf tar/cronie-1.7.1.tar.xz -C source
""", """
echo "[COGMAN] Configuring cronie, sir."
cd build
../source/cronie-1.7.1/configure --prefix=/usr \
  --sysconfdir=/etc
"""]

[installer]
steps = ["""
echo "[COGMAN] Building cronie, sir."
cd build
make -j$(nproc)
""", """
echo "[COGMAN] Installing cronie into staging root, sir."
cd build
make install DESTDIR="$PKGROOT"
"""]

[policy]