[identity]
name = "logrotate"
version = "3.21.0"
category = "system"
summary = """
Log file rotation utility to manage growing log files
"""

[source]
kind = "tarball"
file = "logrotate-3.21.0.tar.xz"

[dependencies]
build = ["toolchain/gcc", "base/linux-pam"]

[build]
steps = ["rm -rf source build", "mkdir -p source build", """
echo "[COGMAN] Extracting logrotate source, sir."
tar -xf tar/logrotate-3.21.0.tar.xz -C source
""", """
echo "[COGMAN] Configuring logrotate, sir."
cd build
../source/logrotate-3.21.0/configure --prefix=/usr \
  
"""]

[installer]
steps = ["""
echo "[COGMAN] Building logrotate, sir."
cd build
make -j$(nproc)
""", """
echo "[COGMAN] Installing logrotate into staging root, sir."
cd build
make install DESTDIR="$PKGROOT"
"""]

[policy]