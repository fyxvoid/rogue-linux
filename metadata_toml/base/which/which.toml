[identity]
name = "which"
version = "2.21"
category = "base"
summary = """
Utility to locate executables in PATH
"""

[source]
kind = "tarball"
file = "which-2.21.tar.xz"

[dependencies]
build = ["toolchain/gcc"]

[build]
steps = ["rm -rf source build", "mkdir -p source build", """
echo "[COGMAN] Extracting which source, sir."
tar -xf tar/which-2.21.tar.xz -C source
""", """
echo "[COGMAN] Configuring which, sir."
cd build
../source/which-2.21/configure --prefix=/usr \
  
"""]

[installer]
steps = ["""
echo "[COGMAN] Building which, sir."
cd build
make -j$(nproc)
""", """
echo "[COGMAN] Installing which into staging root, sir."
cd build
make install DESTDIR="$PKGROOT"
"""]

[policy]