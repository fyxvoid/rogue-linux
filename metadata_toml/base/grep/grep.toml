[identity]
name = "grep"
version = "3.11"
category = "base"
summary = """
GNU Grep pattern matching utility for searching text
"""

[source]
kind = "tarball"
file = "grep-3.11.tar.xz"

[dependencies]
build = ["toolchain/gcc", "libs/general/pcre2"]

[build]
steps = ["rm -rf source build", "mkdir -p source build", """
echo "[COGMAN] Extracting grep source, sir."
tar -xf tar/grep-3.11.tar.xz -C source
""", """
echo "[COGMAN] Configuring grep, sir."
cd build
../source/grep-3.11/configure --prefix=/usr \
  
"""]

[installer]
steps = ["""
echo "[COGMAN] Building grep, sir."
cd build
make -j$(nproc)
""", """
echo "[COGMAN] Installing grep into staging root, sir."
cd build
make install DESTDIR="$PKGROOT"
"""]

[policy]