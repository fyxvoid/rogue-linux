[identity]
name = "libcap"
version = "2.69"
category = "base"
summary = """
POSIX capabilities library for Linux
"""

[source]
kind = "tarball"
file = "libcap-2.69.tar.xz"

[dependencies]
build = ["toolchain/gcc", "toolchain/glibc"]

[build]
steps = ["rm -rf source build", "mkdir -p source build", """
echo "[COGMAN] Extracting libcap source, sir."
tar -xf tar/libcap-2.69.tar.xz -C source
""", """
echo "[COGMAN] Building libcap, sir."
cd source/libcap-2.69
make -j$(nproc) prefix=/usr lib=lib
"""]

[installer]
steps = ["""
echo "[COGMAN] Building libcap, sir."
cd build
make -j$(nproc)
""", """
echo "[COGMAN] Installing libcap into staging root, sir."
cd build
make install DESTDIR="$PKGROOT"
"""]

[policy]