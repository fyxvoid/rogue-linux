[identity]
name = "libelf"
version = "0.191"
category = "base"
summary = """
ELF object file access library from elfutils
"""

[source]
kind = "tarball"
file = "libelf-0.191.tar.xz"

[dependencies]
build = ["toolchain/gcc", "libs/compression/zlib"]

[build]
steps = ["rm -rf source build", "mkdir -p source build", """
echo "[COGMAN] Extracting libelf source, sir."
tar -xf tar/libelf-0.191.tar.xz -C source
""", """
echo "[COGMAN] Configuring libelf, sir."
cd build
../source/libelf-0.191/configure --prefix=/usr \
  --disable-debuginfod \
  --enable-libdebuginfod=dummy
"""]

[installer]
steps = ["""
echo "[COGMAN] Building libelf, sir."
cd build
make -j$(nproc)
""", """
echo "[COGMAN] Installing libelf into staging root, sir."
cd build
make install DESTDIR="$PKGROOT"
"""]

[policy]