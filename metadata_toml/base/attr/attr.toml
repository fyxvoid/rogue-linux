[identity]
name = "attr"
version = "2.5.2"
category = "base"
summary = """
Extended attributes filesystem utilities and library
"""

[source]
kind = "tarball"
file = "attr-2.5.2.tar.xz"

[dependencies]
build = ["toolchain/gcc"]

[build]
steps = ["rm -rf source build", "mkdir -p source build", """
echo "[COGMAN] Extracting attr source, sir."
tar -xf tar/attr-2.5.2.tar.xz -C source
""", """
echo "[COGMAN] Configuring attr, sir."
cd build
../source/attr-2.5.2/configure --prefix=/usr \
  --sysconfdir=/etc \
  --disable-static
"""]

[installer]
steps = ["""
echo "[COGMAN] Building attr, sir."
cd build
make -j$(nproc)
""", """
echo "[COGMAN] Installing attr into staging root, sir."
cd build
make install DESTDIR="$PKGROOT"
"""]

[policy]