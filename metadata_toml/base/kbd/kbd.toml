[identity]
name = "kbd"
version = "2.6.4"
category = "base"
summary = """
Keyboard mapping and console font utilities
"""

[source]
kind = "tarball"
file = "kbd-2.6.4.tar.xz"

[dependencies]
build = ["toolchain/gcc"]

[build]
steps = ["rm -rf source build", "mkdir -p source build", """
echo "[COGMAN] Extracting kbd source, sir."
tar -xf tar/kbd-2.6.4.tar.xz -C source
""", """
echo "[COGMAN] Configuring kbd, sir."
cd build
../source/kbd-2.6.4/configure --prefix=/usr \
  --disable-vlock
"""]

[installer]
steps = ["""
echo "[COGMAN] Building kbd, sir."
cd build
make -j$(nproc)
""", """
echo "[COGMAN] Installing kbd into staging root, sir."
cd build
make install DESTDIR="$PKGROOT"
"""]

[policy]