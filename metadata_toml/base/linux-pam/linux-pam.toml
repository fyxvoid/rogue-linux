[identity]
name = "linux-pam"
version = "1.6.0"
category = "base"
summary = """
Pluggable Authentication Modules framework
"""

[source]
kind = "tarball"
file = "linux-pam-1.6.0.tar.xz"

[dependencies]
build = ["toolchain/gcc"]

[build]
steps = ["rm -rf source build", "mkdir -p source build", """
echo "[COGMAN] Extracting linux-pam source, sir."
tar -xf tar/linux-pam-1.6.0.tar.xz -C source
""", """
echo "[COGMAN] Configuring linux-pam, sir."
cd build
../source/linux-pam-1.6.0/configure --prefix=/usr \
  --sysconfdir=/etc \
  --disable-db
"""]

[installer]
steps = ["""
echo "[COGMAN] Building linux-pam, sir."
cd build
make -j$(nproc)
""", """
echo "[COGMAN] Installing linux-pam into staging root, sir."
cd build
make install DESTDIR="$PKGROOT"
"""]

[policy]