[identity]
name = "acl"
version = "2.3.2"
category = "base"
summary = """
Access Control List utilities and library
"""

[source]
kind = "tarball"
file = "acl-2.3.2.tar.xz"

[dependencies]
build = ["toolchain/gcc", "base/attr"]

[build]
steps = ["rm -rf source build", "mkdir -p source build", """
echo "[COGMAN] Extracting acl source, sir."
tar -xf tar/acl-2.3.2.tar.xz -C source
""", """
echo "[COGMAN] Configuring acl, sir."
cd build
../source/acl-2.3.2/configure --prefix=/usr \
  --disable-static
"""]

[installer]
steps = ["""
echo "[COGMAN] Building acl, sir."
cd build
make -j$(nproc)
""", """
echo "[COGMAN] Installing acl into staging root, sir."
cd build
make install DESTDIR="$PKGROOT"
"""]

[policy]