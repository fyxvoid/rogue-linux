[identity]
name = "procps-ng"
version = "4.0.4"
category = "base"
summary = """
Process monitoring utilities including ps top and free
"""

[source]
kind = "tarball"
file = "procps-ng-4.0.4.tar.xz"

[dependencies]
build = ["toolchain/gcc", "base/ncurses"]

[build]
steps = ["rm -rf source build", "mkdir -p source build", """
echo "[COGMAN] Extracting procps-ng source, sir."
tar -xf tar/procps-ng-4.0.4.tar.xz -C source
""", """
echo "[COGMAN] Configuring procps-ng, sir."
cd build
../source/procps-ng-4.0.4/configure --prefix=/usr \
  --disable-static \
  --disable-kill
"""]

[installer]
steps = ["""
echo "[COGMAN] Building procps-ng, sir."
cd build
make -j$(nproc)
""", """
echo "[COGMAN] Installing procps-ng into staging root, sir."
cd build
make install DESTDIR="$PKGROOT"
"""]

[policy]