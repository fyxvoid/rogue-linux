[identity]
name = "less"
version = "643"
category = "base"
summary = """
Terminal pager for viewing file contents
"""

[source]
kind = "tarball"
file = "less-643.tar.xz"

[dependencies]
build = ["toolchain/gcc", "base/ncurses"]

[build]
steps = ["rm -rf source build", "mkdir -p source build", """
echo "[COGMAN] Extracting less source, sir."
tar -xf tar/less-643.tar.xz -C source
""", """
echo "[COGMAN] Configuring less, sir."
cd build
../source/less-643/configure --prefix=/usr \
  --sysconfdir=/etc
"""]

[installer]
steps = ["""
echo "[COGMAN] Building less, sir."
cd build
make -j$(nproc)
""", """
echo "[COGMAN] Installing less into staging root, sir."
cd build
make install DESTDIR="$PKGROOT"
"""]

[policy]