[identity]
name = "libtirpc"
version = "1.3.4"
category = "base"
summary = """
Transport Independent RPC library for NFS support
"""

[source]
kind = "tarball"
file = "libtirpc-1.3.4.tar.xz"

[dependencies]
build = ["toolchain/gcc"]

[build]
steps = ["rm -rf source build", "mkdir -p source build", """
echo "[COGMAN] Extracting libtirpc source, sir."
tar -xf tar/libtirpc-1.3.4.tar.xz -C source
""", """
echo "[COGMAN] Configuring libtirpc, sir."
cd build
../source/libtirpc-1.3.4/configure --prefix=/usr \
  --sysconfdir=/etc \
  --disable-static \
  --disable-gssapi
"""]

[installer]
steps = ["""
echo "[COGMAN] Building libtirpc, sir."
cd build
make -j$(nproc)
""", """
echo "[COGMAN] Installing libtirpc into staging root, sir."
cd build
make install DESTDIR="$PKGROOT"
"""]

[policy]