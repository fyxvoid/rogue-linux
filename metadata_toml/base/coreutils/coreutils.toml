[identity]
name = "coreutils"
version = "9.5"
category = "base"
summary = """
GNU Core Utilities providing essential file shell and text commands
"""

[source]
kind = "tarball"
file = "coreutils-9.5.tar.xz"

[dependencies]
build = ["toolchain/gcc", "toolchain/glibc"]

[build]
steps = ["rm -rf source build", "mkdir -p source build", """
echo "[COGMAN] Extracting coreutils source, sir."
tar -xf tar/coreutils-9.5.tar.xz -C source
""", """
echo "[COGMAN] Configuring coreutils, sir."
cd build
../source/coreutils-9.5/configure --prefix=/usr \
  --enable-no-install-program=kill,uptime
"""]

[installer]
steps = ["""
echo "[COGMAN] Building coreutils, sir."
cd build
make -j$(nproc)
""", """
echo "[COGMAN] Installing coreutils into staging root, sir."
cd build
make install DESTDIR="$PKGROOT"
"""]

[policy]