[identity]
name = "inetutils"
version = "2.5"
category = "base"
summary = """
GNU network utilities including ftp telnet and ping
"""

[source]
kind = "tarball"
file = "inetutils-2.5.tar.xz"

[dependencies]
build = ["toolchain/gcc", "base/ncurses", "base/readline"]

[build]
steps = ["rm -rf source build", "mkdir -p source build", """
echo "[COGMAN] Extracting inetutils source, sir."
tar -xf tar/inetutils-2.5.tar.xz -C source
""", """
echo "[COGMAN] Configuring inetutils, sir."
cd build
../source/inetutils-2.5/configure --prefix=/usr \
  --bindir=/usr/bin \
  --localstatedir=/var \
  --disable-logger \
  --disable-whois \
  --disable-rcp \
  --disable-rexec \
  --disable-rlogin \
  --disable-rsh \
  --disable-servers
"""]

[installer]
steps = ["""
echo "[COGMAN] Building inetutils, sir."
cd build
make -j$(nproc)
""", """
echo "[COGMAN] Installing inetutils into staging root, sir."
cd build
make install DESTDIR="$PKGROOT"
"""]

[policy]