[identity]
name = "gawk"
version = "5.3.0"
category = "base"
summary = """
GNU AWK pattern scanning and processing language
"""

[source]
kind = "tarball"
file = "gawk-5.3.0.tar.xz"

[dependencies]
build = ["toolchain/gcc", "toolchain/glibc"]

[build]
steps = ["rm -rf source build", "mkdir -p source build", """
echo "[COGMAN] Extracting gawk source, sir."
tar -xf tar/gawk-5.3.0.tar.xz -C source
""", """
echo "[COGMAN] Configuring gawk, sir."
cd build
../source/gawk-5.3.0/configure --prefix=/usr \
  
"""]

[installer]
steps = ["""
echo "[COGMAN] Building gawk, sir."
cd build
make -j$(nproc)
""", """
echo "[COGMAN] Installing gawk into staging root, sir."
cd build
make install DESTDIR="$PKGROOT"
"""]

[policy]