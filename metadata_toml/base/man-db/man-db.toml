[identity]
name = "man-db"
version = "2.12.0"
category = "base"
summary = """
Manual page viewer and database utilities
"""

[source]
kind = "tarball"
file = "man-db-2.12.0.tar.xz"

[dependencies]
build = ["toolchain/gcc", "base/less"]

[build]
steps = ["rm -rf source build", "mkdir -p source build", """
echo "[COGMAN] Extracting man-db source, sir."
tar -xf tar/man-db-2.12.0.tar.xz -C source
""", """
echo "[COGMAN] Configuring man-db, sir."
cd build
../source/man-db-2.12.0/configure --prefix=/usr \
  --sysconfdir=/etc \
  --disable-setuid
"""]

[installer]
steps = ["""
echo "[COGMAN] Building man-db, sir."
cd build
make -j$(nproc)
""", """
echo "[COGMAN] Installing man-db into staging root, sir."
cd build
make install DESTDIR="$PKGROOT"
"""]

[policy]