[identity]
name = "linux-firmware"
version = "20240312"
category = "kernel"
summary = """
Binary firmware files for Linux kernel device drivers
"""

[source]
kind = "tarball"
file = "linux-firmware-20240312.tar.xz"

[build]
steps = ["rm -rf source build", "mkdir -p source build", """
echo "[COGMAN] Extracting linux-firmware source, sir."
tar -xf tar/linux-firmware-20240312.tar.xz -C source
""", """
echo "[COGMAN] Building linux-firmware, sir."
cd source/linux-firmware-20240312
make -j$(nproc) DESTDIR=$PKGROOT install
"""]

[installer]
steps = ["""
echo "[COGMAN] Building linux-firmware, sir."
cd build
make -j$(nproc)
""", """
echo "[COGMAN] Installing linux-firmware into staging root, sir."
cd build
make install DESTDIR="$PKGROOT"
"""]

[policy]