[identity]
name = "dracut"
version = "059"
category = "kernel"
summary = """
Event-driven initramfs generator for Linux
"""

[source]
kind = "tarball"
file = "dracut-059.tar.xz"

[dependencies]
build = ["toolchain/gcc", "base/bash", "base/coreutils"]

[build]
steps = ["rm -rf source build", "mkdir -p source build", """
echo "[COGMAN] Extracting dracut source, sir."
tar -xf tar/dracut-059.tar.xz -C source
""", """
echo "[COGMAN] Configuring dracut, sir."
cd build
../source/dracut-059/configure --prefix=/usr \
  --sysconfdir=/etc
"""]

[installer]
steps = ["""
echo "[COGMAN] Building dracut, sir."
cd build
make -j$(nproc)
""", """
echo "[COGMAN] Installing dracut into staging root, sir."
cd build
make install DESTDIR="$PKGROOT"
"""]

[policy]