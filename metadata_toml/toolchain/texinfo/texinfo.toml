[identity]
name = "texinfo"
version = "7.1"
category = "toolchain"
summary = """
GNU documentation system for online and printed output
"""

[source]
kind = "tarball"
file = "texinfo-7.1.tar.xz"

[dependencies]
build = ["toolchain/perl", "toolchain/gcc"]

[build]
steps = ["rm -rf source build", "mkdir -p source build", """
echo "[COGMAN] Extracting texinfo source, sir."
tar -xf tar/texinfo-7.1.tar.xz -C source
""", """
echo "[COGMAN] Configuring texinfo, sir."
cd build
../source/texinfo-7.1/configure --prefix=/usr \
  
"""]

[installer]
steps = ["""
echo "[COGMAN] Building texinfo, sir."
cd build
make -j$(nproc)
""", """
echo "[COGMAN] Installing texinfo into staging root, sir."
cd build
make install DESTDIR="$PKGROOT"
"""]

[policy]