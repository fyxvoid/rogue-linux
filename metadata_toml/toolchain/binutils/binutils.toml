[identity]
name = "binutils"
version = "2.42"
category = "toolchain"
summary = """
GNU Binary Utilities including linker assembler and object file tools
"""

[source]
kind = "tarball"
file = "binutils-2.42.tar.xz"

[dependencies]
build = ["toolchain/gcc"]

[build]
steps = ["rm -rf source build", "mkdir -p source build", """
echo "[COGMAN] Extracting binutils source, sir."
tar -xf tar/binutils-2.42.tar.xz -C source
""", """
echo "[COGMAN] Configuring binutils, sir."
cd build
../source/binutils-2.42/configure --prefix=/usr \
  --enable-gold \
  --enable-plugins \
  --enable-shared \
  --disable-werror \
  --with-system-zlib
"""]

[installer]
steps = ["""
echo "[COGMAN] Building binutils, sir."
cd build
make -j$(nproc)
""", """
echo "[COGMAN] Installing binutils into staging root, sir."
cd build
make install DESTDIR="$PKGROOT"
"""]

[policy]