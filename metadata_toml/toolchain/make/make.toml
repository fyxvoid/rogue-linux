[identity]
name = "make"
version = "4.4.1"
category = "toolchain"
summary = """
GNU Make build automation tool
"""

[source]
kind = "tarball"
file = "make-4.4.1.tar.xz"

[dependencies]
build = ["toolchain/gcc", "toolchain/glibc"]

[build]
steps = ["rm -rf source build", "mkdir -p source build", """
echo "[COGMAN] Extracting make source, sir."
tar -xf tar/make-4.4.1.tar.xz -C source
""", """
echo "[COGMAN] Configuring make, sir."
cd build
../source/make-4.4.1/configure --prefix=/usr \
  
"""]

[installer]
steps = ["""
echo "[COGMAN] Building make, sir."
cd build
make -j$(nproc)
""", """
echo "[COGMAN] Installing make into staging root, sir."
cd build
make install DESTDIR="$PKGROOT"
"""]

[policy]