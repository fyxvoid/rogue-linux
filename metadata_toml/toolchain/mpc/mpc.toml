[identity]
name = "mpc"
version = "1.3.1"
category = "toolchain"
summary = """
GNU Multiple Precision Complex arithmetic library
"""

[source]
kind = "tarball"
file = "mpc-1.3.1.tar.xz"

[dependencies]
build = ["toolchain/gmp", "toolchain/mpfr", "toolchain/gcc"]

[build]
steps = ["rm -rf source build", "mkdir -p source build", """
echo "[COGMAN] Extracting mpc source, sir."
tar -xf tar/mpc-1.3.1.tar.xz -C source
""", """
echo "[COGMAN] Configuring mpc, sir."
cd build
../source/mpc-1.3.1/configure --prefix=/usr \
  
"""]

[installer]
steps = ["""
echo "[COGMAN] Building mpc, sir."
cd build
make -j$(nproc)
""", """
echo "[COGMAN] Installing mpc into staging root, sir."
cd build
make install DESTDIR="$PKGROOT"
"""]

[policy]