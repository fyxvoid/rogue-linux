[identity]
name = "libstdc++"
version = "14.1.0"
category = "toolchain"
summary = """
GNU Standard C++ Library providing C++ standard library implementation
"""

[source]
kind = "tarball"
file = "libstdc++-14.1.0.tar.xz"

[dependencies]
build = ["toolchain/gcc", "toolchain/glibc"]

[build]
steps = ["rm -rf source build", "mkdir -p source build", """
echo "[COGMAN] Extracting libstdc++ source, sir."
tar -xf tar/libstdc++-14.1.0.tar.xz -C source
""", """
echo "[COGMAN] Configuring libstdc++, sir."
cd build
../source/libstdc++-14.1.0/configure --prefix=/usr
"""]

[installer]
steps = ["""
echo "[COGMAN] Building libstdc++, sir."
cd build
make -j$(nproc)
""", """
echo "[COGMAN] Installing libstdc++ into staging root, sir."
cd build
make install DESTDIR="$PKGROOT"
"""]

[policy]