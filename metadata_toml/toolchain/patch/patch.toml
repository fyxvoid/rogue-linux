[identity]
name = "patch"
version = "2.7.6"
category = "toolchain"
summary = """
GNU Patch utility for applying diff files
"""

[source]
kind = "tarball"
file = "patch-2.7.6.tar.xz"

[dependencies]
build = ["toolchain/gcc"]

[build]
steps = ["rm -rf source build", "mkdir -p source build", """
echo "[COGMAN] Extracting patch source, sir."
tar -xf tar/patch-2.7.6.tar.xz -C source
""", """
echo "[COGMAN] Configuring patch, sir."
cd build
../source/patch-2.7.6/configure --prefix=/usr \
  
"""]

[installer]
steps = ["""
echo "[COGMAN] Building patch, sir."
cd build
make -j$(nproc)
""", """
echo "[COGMAN] Installing patch into staging root, sir."
cd build
make install DESTDIR="$PKGROOT"
"""]

[policy]