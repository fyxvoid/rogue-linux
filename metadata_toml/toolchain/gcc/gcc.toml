[identity]
name = "gcc"
version = "14.1.0"
category = "toolchain"
summary = """
GNU Compiler Collection providing C and C++ compilers for the bootstrap system
"""

[source]
kind = "tarball"
file = "gcc-14.1.0.tar.xz"

[dependencies]
build = ["toolchain/binutils", "toolchain/glibc", "toolchain/gmp", "toolchain/mpfr", "toolchain/mpc"]

[build]
steps = ["rm -rf source build", "mkdir -p source build", """
echo "[COGMAN] Extracting gcc source, sir."
tar -xf tar/gcc-14.1.0.tar.xz -C source
""", """
echo "[COGMAN] Configuring gcc, sir."
cd build
../source/gcc-14.1.0/configure --prefix=/usr \
  --disable-multilib \
  --disable-nls \
  --enable-languages=c,c++ \
  --enable-default-pie \
  --enable-default-ssp \
  --with-system-zlib
"""]

[installer]
steps = ["""
echo "[COGMAN] Building gcc, sir."
cd build
make -j$(nproc)
""", """
echo "[COGMAN] Installing gcc into staging root, sir."
cd build
make install DESTDIR="$PKGROOT"
"""]

[policy]