[identity]
name = "bc"
version = "6.7.5"
category = "toolchain"
summary = """
Arbitrary precision calculator language
"""

[source]
kind = "tarball"
file = "bc-6.7.5.tar.xz"

[dependencies]
build = ["toolchain/gcc"]

[build]
steps = ["rm -rf source build", "mkdir -p source build", """
echo "[COGMAN] Extracting bc source, sir."
tar -xf tar/bc-6.7.5.tar.xz -C source
""", """
echo "[COGMAN] Configuring bc, sir."
cd build
../source/bc-6.7.5/configure --prefix=/usr \
  
"""]

[installer]
steps = ["""
echo "[COGMAN] Building bc, sir."
cd build
make -j$(nproc)
""", """
echo "[COGMAN] Installing bc into staging root, sir."
cd build
make install DESTDIR="$PKGROOT"
"""]

[policy]