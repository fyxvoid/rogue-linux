[identity]
name = "m4"
version = "1.4.19"
category = "toolchain"
summary = """
GNU M4 macro processor
"""

[source]
kind = "tarball"
file = "m4-1.4.19.tar.xz"

[dependencies]
build = ["toolchain/gcc", "toolchain/glibc"]

[build]
steps = ["rm -rf source build", "mkdir -p source build", """
echo "[COGMAN] Extracting m4 source, sir."
tar -xf tar/m4-1.4.19.tar.xz -C source
""", """
echo "[COGMAN] Configuring m4, sir."
cd build
../source/m4-1.4.19/configure --prefix=/usr \
  
"""]

[installer]
steps = ["""
echo "[COGMAN] Building m4, sir."
cd build
make -j$(nproc)
""", """
echo "[COGMAN] Installing m4 into staging root, sir."
cd build
make install DESTDIR="$PKGROOT"
"""]

[policy]