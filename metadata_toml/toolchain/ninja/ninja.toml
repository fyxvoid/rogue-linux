[identity]
name = "ninja"
version = "1.12.0"
category = "toolchain"
summary = """
Small fast build system focused on speed
"""

[source]
kind = "tarball"
file = "ninja-1.12.0.tar.xz"

[dependencies]
build = ["toolchain/gcc", "toolchain/cmake"]

[build]
steps = ["rm -rf source build", "mkdir -p source build", """
echo "[COGMAN] Extracting ninja source, sir."
tar -xf tar/ninja-1.12.0.tar.xz -C source
""", """
echo "[COGMAN] Configuring ninja with CMake, sir."
cd build
cmake ../source/ninja-1.12.0 -DCMAKE_INSTALL_PREFIX=/usr -DCMAKE_BUILD_TYPE=Release
"""]

[installer]
steps = ["""
echo "[COGMAN] Building ninja, sir."
cd build
make -j$(nproc)
""", """
echo "[COGMAN] Installing ninja into staging root, sir."
cd build
make install DESTDIR="$PKGROOT"
"""]

[policy]