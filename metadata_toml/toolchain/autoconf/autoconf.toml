[identity]
name = "autoconf"
version = "2.72"
category = "toolchain"
summary = """
GNU Autoconf configuration script generator
"""

[source]
kind = "tarball"
file = "autoconf-2.72.tar.xz"

[dependencies]
build = ["toolchain/m4", "toolchain/perl"]

[build]
steps = ["rm -rf source build", "mkdir -p source build", """
echo "[COGMAN] Extracting autoconf source, sir."
tar -xf tar/autoconf-2.72.tar.xz -C source
""", """
echo "[COGMAN] Configuring autoconf, sir."
cd build
../source/autoconf-2.72/configure --prefix=/usr \
  
"""]

[installer]
steps = ["""
echo "[COGMAN] Building autoconf, sir."
cd build
make -j$(nproc)
""", """
echo "[COGMAN] Installing autoconf into staging root, sir."
cd build
make install DESTDIR="$PKGROOT"
"""]

[policy]