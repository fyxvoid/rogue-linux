[identity]
name     = "nmap"
version  = "7.99"
category = "pentest"
summary  = "Network mapper — port scan, service/OS detection, NSE scripting"

[identity.source]
kind = "none"

[identity.depends]
build   = []
runtime = ["libpcap"]

[build]
system = "none"
steps  = []

[installer]
steps = [
    "sh -c 'ls -la /usr/lib/nmap/nmap && echo NMAP_BINARY_OK'",
    "nmap --version",
    "sh -c 'nmap -sT -p 22 --host-timeout 5s localhost 2>&1 | grep -q Nmap && echo NMAP_SCAN_OK'",
    "sh -c 'ls -la /usr/bin/nmap && echo NMAP_WRAPPER_OK'",
]

[policy]
[policy.filesystem]
read  = ["/"]
write = ["/usr/bin", "/usr/lib/nmap", "/usr/share/nmap"]
[policy.network]
outbound     = true
capabilities = ["cap_net_raw", "cap_net_admin"]

[uninstaller]
steps = [
    "rm -f /usr/bin/nmap /usr/bin/nping",
    "rm -f /usr/lib/nmap/nmap",
    "rm -rf /usr/share/nmap",
]
