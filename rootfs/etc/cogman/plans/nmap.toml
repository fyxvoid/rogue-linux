[identity]
name     = "nmap"
version  = ""
category = "network"
summary  = "Network scanner — port scan, service detection, NSE scripting"

[identity.source]
kind   = "tarball"
url    = "https://nmap.org/dist/nmap-.tar.bz2"

[identity.depends]
build = ["libpcap"]

[build]
system = "autoconf"
steps  = [
    "curl -L https://nmap.org/dist/nmap-.tar.bz2 -o /tmp/nmap.tar.bz2",
    "tar -xjf /tmp/nmap.tar.bz2 -C /tmp",
    "sh -c 'cd /tmp/nmap- && ./configure --prefix=/usr --without-zenmap --without-ncat --without-ndiff && make -j$(nproc) && make install'",
]

[installer]
steps = [
    "nmap --version && echo NMAP_OK",
]

[policy]
[policy.filesystem]
read  = ["/"]
write = ["/usr/bin", "/usr/share/nmap"]
[policy.network]
outbound     = true
capabilities = ["cap_net_raw", "cap_net_admin"]

[uninstaller]
steps = [
    "rm -f /usr/bin/nmap /usr/bin/nping",
    "rm -rf /usr/share/nmap",
]
