[identity]
name     = "eudev"
version  = "3.2.14"
category = "system"
summary  = "Standalone udev fork — persistent device naming, udev rules, no systemd dependency"

# NOTE: Rogue Linux currently uses mdevd (installed at /sbin/mdevd) which
# supports udev-style rule semantics via /etc/mdev.conf. eudev provides full
# udev ABI compatibility (/sbin/udevd, /sbin/udevadm, libudev.so) required
# by tools that link against libudev (e.g. libinput, libgudev, upower).
# Build this plan inside the running distro when those dependencies are needed.

[identity.source]
kind = "tarball"
url  = "https://github.com/eudev-project/eudev/releases/download/v3.2.14/eudev-3.2.14.tar.gz"

[identity.depends]
build   = ["gperf", "util-linux", "kmod", "xz"]
runtime = []

[build]
system = "autoconf"
steps  = [
    # 1. Fetch source
    "curl -L https://github.com/eudev-project/eudev/releases/download/v3.2.14/eudev-3.2.14.tar.gz -o /tmp/eudev-3.2.14.tar.gz",
    "tar -xzf /tmp/eudev-3.2.14.tar.gz -C /tmp",

    # 2. Configure — disable hwdb, manpages, tests to keep build minimal
    "sh -c 'cd /tmp/eudev-3.2.14 && ./configure \
        --prefix=/usr \
        --sbindir=/sbin \
        --sysconfdir=/etc \
        --with-rootprefix= \
        --with-rootlibdir=/lib \
        --enable-static \
        --disable-shared \
        --disable-manpages \
        --disable-hwdb \
        --disable-introspection \
        --disable-selinux \
        2>&1'",

    # 3. Build
    "sh -c 'cd /tmp/eudev-3.2.14 && make -j$(nproc) 2>&1'",

    # 4. Install to rootfs
    "sh -c 'cd /tmp/eudev-3.2.14 && make install 2>&1'",

    # 5. Trigger hwdb generation (skip if hwdb disabled)
    # "udevadm hwdb --update",
]

[installer]
steps = [
    # Verify core binaries are present
    "test -x /sbin/udevd   && echo udevd_OK",
    "test -x /sbin/udevadm && echo udevadm_OK",

    # Seed /etc/udev/rules.d with the pentest rules (already present from mdevd setup)
    "test -f /etc/udev/rules.d/99-pentest.rules && echo rules_OK",

    # Disable mdevd service, enable eudev
    # (run these in cogman-ctl after install)
    # cogman-ctl disable udev
    # cogman-ctl enable udev-eudev
    "echo 'eudev installed — update udev.service command to /sbin/udevd --daemon'",
]

[policy]
[policy.filesystem]
read  = ["/"]
write = ["/sbin", "/lib", "/usr/lib", "/etc/udev", "/usr/share/pkgconfig"]
[policy.network]
outbound = true

[uninstaller]
steps = [
    "rm -f /sbin/udevd /sbin/udevadm",
    "rm -f /lib/libudev.a /usr/lib/libudev.a",
    "rm -f /usr/lib/pkgconfig/libudev.pc",
    # restore mdevd service
    "echo 'restore udev.service to use mdevd if needed'",
]

[notes]
migration = """
After eudev is installed and working, update udev.service:

  command = \"/sbin/udevd --daemon\"

Then reload cogman:
  cogman-ctl reload

udev rules from /etc/udev/rules.d/99-pentest.rules are picked up automatically.
Run: udevadm trigger --action=add  — to replay events with new rules.
"""
