# mdev.conf — used by mdevd (and busybox mdev fallback)
# Format: DEVNAME  OWNER:GROUP  PERMISSIONS  [>RENAME|=SYMLINK|@CMD|$CMD|*CMD]
# Rogue Linux — pentest-focused device rules

# ── Block devices ────────────────────────────────────────────────────────────
sd[a-z]             root:disk   0640
sd[a-z][0-9]*       root:disk   0660
nvme[0-9]*n[0-9]*   root:disk   0660
nvme[0-9]*n[0-9]*p[0-9]*  root:disk 0660
mmcblk[0-9]*        root:disk   0660
mmcblk[0-9]*p[0-9]* root:disk   0660
sr[0-9]*            root:disk   0660
loop[0-9]*          root:disk   0660
dm-[0-9]*           root:disk   0660

# ── Network ───────────────────────────────────────────────────────────────────
# TUN/TAP — VPN, network namespaces, tunnelling tools
tun[0-9]*           root:netdev 0660
tap[0-9]*           root:netdev 0660
net/tun             root:netdev 0660

# ── USB serial / pentest adapters ─────────────────────────────────────────────
# FTDI FT232/FT2232 — used on Alfa, custom pentest cables, HackRF
ttyUSB[0-9]*        root:dialout 0660
# CP210x / PL2303 / CH340 — common cheap USB-serial adapters
ttyACM[0-9]*        root:dialout 0660
# Onboard / modem / GPS serial
ttyS[0-9]*          root:dialout 0660

# ── Input devices ─────────────────────────────────────────────────────────────
event[0-9]*         root:input  0660
mouse[0-9]*         root:input  0660
mice                root:input  0660
js[0-9]*            root:input  0660

# ── DRM / GPU ─────────────────────────────────────────────────────────────────
card[0-9]*          root:video  0660
renderD[0-9]*       root:video  0660
dri/card[0-9]*      root:video  0660
dri/renderD[0-9]*   root:video  0660

# ── Wireless / rfkill ─────────────────────────────────────────────────────────
rfkill              root:netdev 0660

# ── Audio ─────────────────────────────────────────────────────────────────────
pcmC[0-9]*D[0-9]*   root:audio  0660
controlC[0-9]*      root:audio  0660
timer               root:audio  0660
seq                 root:audio  0660

# ── USB raw access (for libusb — needed by wireless injection, HackRF, etc) ──
bus/usb/[0-9]*/[0-9]*   root:plugdev 0664

# ── Entropy / crypto ──────────────────────────────────────────────────────────
random              root:root   0666
urandom             root:root   0666
hwrng               root:root   0640

# ── Virtual / misc ───────────────────────────────────────────────────────────
null                root:root   0666
zero                root:root   0666
full                root:root   0666
tty                 root:tty    0666
tty[0-9]*           root:tty    0620
ptmx                root:tty    0666
pts/[0-9]*          root:tty    0620
console             root:tty    0600
kmsg                root:root   0640
mem                 root:kmem   0640
kmem                root:kmem   0640

# ── Watchdog ─────────────────────────────────────────────────────────────────
watchdog[0-9]*      root:root   0600

# ── I2C / SPI (embedded / IoT pentesting) ─────────────────────────────────────
i2c-[0-9]*          root:i2c    0660
spidev[0-9]*        root:spi    0660
