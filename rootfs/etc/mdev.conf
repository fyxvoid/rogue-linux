# mdev.conf — device permissions for Rogue Linux
# Format: <device regex>  <user>:<group>  <perms>  [action]

# Input devices — needed by libinput/X11
input/event[0-9]*   root:input  0660
input/mice          root:input  0660
input/mouse[0-9]*   root:input  0660
input/js[0-9]*      root:input  0660

# DRI — needed by modesetting Xorg driver
dri/card[0-9]*      root:video  0660
dri/renderD[0-9]*   root:video  0660

# FB framebuffer
fb[0-9]*            root:video  0660

# TTYs
tty[0-9]*           root:tty    0620
ttyS[0-9]*          root:dialout 0660

# Default fallback
.*                  root:root   0660
