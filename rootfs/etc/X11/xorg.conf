# Rogue Linux xorg.conf — modesetting + libinput (QEMU)

Section "ServerFlags"
  Option "AutoAddDevices"    "true"
  Option "AutoEnableDevices" "true"
EndSection

Section "Device"
  Identifier "gpu0"
  Driver     "modesetting"
  Option     "AccelMethod" "none"
EndSection

Section "Monitor"
  Identifier "Monitor0"
  Option     "DPMS" "false"
EndSection

Section "Screen"
  Identifier "Screen0"
  Device     "gpu0"
  Monitor    "Monitor0"
  DefaultDepth 24
  SubSection "Display"
    Depth 24
    Modes "1280x800" "1024x768" "800x600"
  EndSubSection
EndSection

# PS/2 keyboard — explicit device path so libinput finds it without udev
Section "InputDevice"
  Identifier "keyboard0"
  Driver     "libinput"
  Option     "Device"      "/dev/input/event0"
  Option     "XkbLayout"   "us"
  Option     "XkbModel"    "pc105"
  Option     "XkbVariant"  ""
  Option     "XkbOptions"  ""
EndSection

# USB tablet (mouse) — explicit device path
Section "InputDevice"
  Identifier "mouse0"
  Driver     "libinput"
  Option     "Device"      "/dev/input/event3"
EndSection

Section "ServerLayout"
  Identifier "Layout0"
  Screen     "Screen0"
  InputDevice "keyboard0" "CoreKeyboard"
  InputDevice "mouse0"    "CorePointer"
EndSection

Section "Module"
  Disable "glx"
  Disable "dri"
  Disable "dri2"
  Disable "dri3"
EndSection
