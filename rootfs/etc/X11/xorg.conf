# Rogue Linux xorg.conf — modesetting + evdev (no udev required)

Section "ServerFlags"
  Option "AutoAddDevices"    "false"
  Option "AutoEnableDevices" "false"
  Option "AllowEmptyInput"   "false"
EndSection

Section "Device"
  Identifier "gpu0"
  Driver     "modesetting"
  Option     "AccelMethod" "none"
EndSection

Section "Monitor"
  Identifier "Monitor0"
  Option     "DPMS" "false"
EndSection

Section "Screen"
  Identifier "Screen0"
  Device     "gpu0"
  Monitor    "Monitor0"
  DefaultDepth 24
  SubSection "Display"
    Depth 24
    Modes "1280x800" "1024x768" "800x600"
  EndSubSection
EndSection

# VirtIO Keyboard — evdev, no udev needed
Section "InputDevice"
  Identifier  "vkbd"
  Driver      "evdev"
  Option      "Device"      "/dev/input/event1"
  Option      "XkbRules"    "evdev"
  Option      "XkbModel"    "pc105"
  Option      "XkbLayout"   "us"
  Option      "XkbVariant"  ""
  Option      "XkbOptions"  ""
EndSection

# VirtIO Mouse — evdev, no udev needed
Section "InputDevice"
  Identifier  "vmouse"
  Driver      "evdev"
  Option      "Device"      "/dev/input/event2"
  Option      "Protocol"    "auto"
EndSection

Section "ServerLayout"
  Identifier   "Layout0"
  Screen       "Screen0"
  InputDevice  "vkbd"    "CoreKeyboard"
  InputDevice  "vmouse"  "CorePointer"
EndSection

Section "Module"
  Disable "glx"
  Disable "dri"
  Disable "dri2"
  Disable "dri3"
EndSection
