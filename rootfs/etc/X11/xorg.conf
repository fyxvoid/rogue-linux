Section "ServerFlags"
  Option "AutoAddDevices" "true"
  Option "AutoEnableDevices" "true"
EndSection

Section "Device"
  Identifier "virtio-gpu"
  Driver     "modesetting"
  Option     "AccelMethod" "none"
EndSection

Section "Monitor"
  Identifier "Monitor0"
  Option     "DPMS" "false"
EndSection

Section "Screen"
  Identifier "Screen0"
  Device     "virtio-gpu"
  Monitor    "Monitor0"
  DefaultDepth 24
  SubSection "Display"
    Depth 24
    Modes "1280x800" "1024x768" "800x600"
  EndSubSection
EndSection

Section "InputClass"
  Identifier "keyboard"
  MatchIsKeyboard "yes"
  Driver "libinput"
EndSection

Section "InputClass"
  Identifier "pointer"
  MatchIsPointer "yes"
  Driver "libinput"
EndSection

Section "Module"
  Disable "glx"
  Disable "dri"
  Disable "dri2"
  Disable "dri3"
EndSection
