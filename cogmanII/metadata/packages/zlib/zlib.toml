# CogmanII Package Metadata — zlib (Small Benchmark)

[identity]
name     = "zlib"
version  = "1.3.1"
category = "base"
summary  = "Compression library"

[identity.source]
kind = "tarball"
file = "zlib-1.3.1.tar.gz"

[identity.depends]
build   = ["toolchain/gcc", "base/glibc"]
runtime = ["base/glibc"]

[builder]
system = "autotools"

[builder.steps]
commands = [
    "rm -rf source build",
    "mkdir -p source build",
    "tar -xf /home/rogue/workspace/rogue-linux/tar/zlib-1.3.1.tar.gz -C source",
    "cd source/zlib-1.3.1 && ./configure --prefix=/usr"
]

[installer]
steps = [
    "cd source/zlib-1.3.1 && make -j$(nproc)",
    "cd source/zlib-1.3.1 && make install DESTDIR=$PKGROOT"
]

[installer.verify]
expected_files = ["usr/lib/libz.so.1.3.1"]

[policy.filesystem]
read  = ["/"]
write = ["/usr"]

[policy.network]
outbound = false

[policy]
capabilities = []
