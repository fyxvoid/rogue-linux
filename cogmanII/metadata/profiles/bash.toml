# CogmanII Package Metadata — bash
# Converted from cogman YAML: metadata/base/bash/metadata/*.yaml

[identity]
name     = "bash"
version  = "5.2.21"
category = "base"
summary  = "GNU Bourne-Again Shell"

[identity.source]
kind = "tarball"
file = "bash-5.2.21.tar.xz"

[identity.depends]
build   = ["toolchain/gcc", "base/ncurses", "base/readline", "base/glibc"]
runtime = ["base/ncurses", "base/readline"]

[builder]
system = "autotools"

[builder.configure]
flags = [
    "--prefix=/usr",
    "--without-bash-malloc",
    "--with-installed-readline",
]

[builder.steps]
commands = [
    "rm -rf source build",
    "mkdir -p source build",
    """echo "[COGMAN] Extracting bash source, sir."
tar -xf /home/rogue/workspace/rogue-linux/tar/bash-5.2.21.tar.xz -C source""",
    """echo "[COGMAN] Configuring bash, sir."
cd build
../source/bash-5.2.21/configure --prefix=/usr --without-bash-malloc --with-installed-readline""",
]

[installer]
steps = [
    """echo "[COGMAN] Building bash, sir."
cd build
make -j$(nproc)""",
    """echo "[COGMAN] Installing bash into staging root, sir."
cd build
make install DESTDIR="$PKGROOT" """,
]

[installer.verify]
expected_files = ["usr/bin/bash"]

[policy.filesystem]
read  = ["/"]
write = ["/usr"]

[policy.network]
outbound = false

[policy]
capabilities = []
