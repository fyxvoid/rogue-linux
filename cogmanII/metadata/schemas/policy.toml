# CogmanII Policy Schema Reference
# Defines sandbox constraints for build and install.

[policy.filesystem]
read  = ["string — paths the package may read from, default: ['/']"]
write = ["string — paths the package may write to, default: ['/usr']"]

[policy.network]
outbound = "boolean — whether outbound network access is allowed, default: false"

[policy]
capabilities = ["string — Linux capabilities required (e.g. 'cap_net_raw')"]
