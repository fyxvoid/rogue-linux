# CogmanII Builder Schema Reference
# Defines how a package is configured and prepared for compilation.

[builder]
system = "string — required, enum: autotools | cmake | meson | make | go | rust | python"

[builder.configure]
flags = ["string — optional, configure/cmake flags"]

[builder.steps]
# Ordered shell commands for build preparation.
# Each step is a string executed verbatim.
# Steps run in the package working directory.
commands = ["string — required, at least one step"]
