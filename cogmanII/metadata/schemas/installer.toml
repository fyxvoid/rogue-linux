# CogmanII Installer Schema Reference
# Defines how built artifacts are installed into the staging root (PKGROOT).

[installer]
# Ordered shell commands to install build artifacts.
# PKGROOT and DESTDIR environment variables are set by the executor.
steps = ["string — required, at least one step"]

[installer.verify]
# Optional verification after install.
# If provided, all checks must pass before finalizing.
expected_files = ["string — paths relative to PKGROOT that must exist"]
checksum       = "string — optional, sha256 of the primary artifact"
