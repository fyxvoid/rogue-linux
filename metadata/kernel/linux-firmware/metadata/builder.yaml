steps:
  - rm -rf source build
  - mkdir -p source build

  - |
      echo "[COGMAN] Extracting linux-firmware source, sir."
      tar -xf tar/linux-firmware-20240312.tar.xz -C source

  - |
      echo "[COGMAN] Building linux-firmware, sir."
      cd source/linux-firmware-20240312
      make -j$(nproc) DESTDIR=$PKGROOT install

