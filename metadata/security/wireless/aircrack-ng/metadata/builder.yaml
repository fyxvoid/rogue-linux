steps:
  - rm -rf source build
  - mkdir -p source build

  - |
      echo "[COGMAN] Extracting aircrack-ng source, sir."
      tar -xf tar/aircrack-ng-1.7.tar.xz -C source

  - |
      echo "[COGMAN] Configuring aircrack-ng, sir."
      cd build
      ../source/aircrack-ng-1.7/configure --prefix=/usr \
        --with-experimental \
        --with-ext-scripts

