steps:
  - rm -rf source build
  - mkdir -p source build

  - |
      echo "[COGMAN] Extracting wifipumpkin3 source, sir."
      tar -xf tar/wifipumpkin3-1.1.5.tar.xz -C source

  - |
      echo "[COGMAN] Building wifipumpkin3 Python package, sir."
      cd source/wifipumpkin3-1.1.5
      python3 setup.py build

