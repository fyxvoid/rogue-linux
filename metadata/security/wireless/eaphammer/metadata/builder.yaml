steps:
  - rm -rf source build
  - mkdir -p source build

  - |
      echo "[COGMAN] Extracting eaphammer source, sir."
      tar -xf tar/eaphammer-1.14.0.tar.xz -C source

  - |
      echo "[COGMAN] Building eaphammer Python package, sir."
      cd source/eaphammer-1.14.0
      python3 setup.py build

