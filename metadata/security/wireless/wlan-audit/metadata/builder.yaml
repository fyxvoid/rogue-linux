steps:
  - rm -rf source build
  - mkdir -p source build

  - |
      echo "[COGMAN] Extracting wlan-audit source, sir."
      tar -xf tar/wlan-audit-1.0.tar.xz -C source

  - |
      echo "[COGMAN] Building wlan-audit Python package, sir."
      cd source/wlan-audit-1.0
      python3 setup.py build

