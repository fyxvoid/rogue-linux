steps:
  - rm -rf source build
  - mkdir -p source build

  - |
      echo "[COGMAN] Extracting rtl-sdr source, sir."
      tar -xf tar/rtl-sdr-2.0.1.tar.xz -C source

  - |
      echo "[COGMAN] Configuring rtl-sdr with CMake, sir."
      cd build
      cmake ../source/rtl-sdr-2.0.1 -DCMAKE_INSTALL_PREFIX=/usr -DCMAKE_BUILD_TYPE=Release

