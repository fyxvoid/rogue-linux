  - mkdir -p source build

  - |
      echo "[COGMAN] Extracting freeradius-wpe source, sir."
      tar -xf tar/freeradius-wpe-3.2.3.tar.xz -C source

  - |
      echo "[COGMAN] Configuring freeradius-wpe, sir."
      cd build
      ../source/freeradius-wpe-3.2.3/configure --prefix=/usr \
        

