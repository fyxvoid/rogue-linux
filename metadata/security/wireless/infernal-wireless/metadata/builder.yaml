steps:
  - rm -rf source build
  - mkdir -p source build

  - |
      echo "[COGMAN] Extracting infernal-wireless source, sir."
      tar -xf tar/infernal-wireless-3.5.tar.xz -C source

  - |
      echo "[COGMAN] Building infernal-wireless Python package, sir."
      cd source/infernal-wireless-3.5
      python3 setup.py build

