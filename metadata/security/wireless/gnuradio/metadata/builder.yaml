steps:
  - rm -rf source build
  - mkdir -p source build

  - |
      echo "[COGMAN] Extracting gnuradio source, sir."
      tar -xf tar/gnuradio-3.10.9.2.tar.xz -C source

  - |
      echo "[COGMAN] Configuring gnuradio with CMake, sir."
      cd build
      cmake ../source/gnuradio-3.10.9.2 -DCMAKE_INSTALL_PREFIX=/usr -DCMAKE_BUILD_TYPE=Release \
        -DENABLE_GR_ANALOG=ON \
        -DENABLE_GR_DIGITAL=ON

