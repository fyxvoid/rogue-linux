steps:
  - rm -rf source build
  - mkdir -p source build

  - |
      echo "[COGMAN] Extracting scout-suite source, sir."
      tar -xf tar/scout-suite-5.14.0.tar.xz -C source

  - |
      echo "[COGMAN] Building scout-suite Python package, sir."
      cd source/scout-suite-5.14.0
      python3 setup.py build

