steps:
  - rm -rf source build
  - mkdir -p source build

  - |
      echo "[COGMAN] Extracting detect-secrets source, sir."
      tar -xf tar/detect-secrets-1.4.0.tar.xz -C source

  - |
      echo "[COGMAN] Building detect-secrets Python package, sir."
      cd source/detect-secrets-1.4.0
      python3 setup.py build

