steps:
  - rm -rf source build
  - mkdir -p source build

  - |
      echo "[COGMAN] Extracting terrascan source, sir."
      tar -xf tar/terrascan-1.19.1.tar.xz -C source

  - |
      echo "[COGMAN] Building terrascan with Go, sir."
      cd source/terrascan-1.19.1
      go build -o ../../build/ ./...

