steps:
  - rm -rf source build
  - mkdir -p source build

  - |
      echo "[COGMAN] Extracting cloudmapper source, sir."
      tar -xf tar/cloudmapper-2.2.0.tar.xz -C source

  - |
      echo "[COGMAN] Building cloudmapper Python package, sir."
      cd source/cloudmapper-2.2.0
      python3 setup.py build

