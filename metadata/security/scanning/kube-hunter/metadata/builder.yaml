steps:
  - rm -rf source build
  - mkdir -p source build

  - |
      echo "[COGMAN] Extracting kube-hunter source, sir."
      tar -xf tar/kube-hunter-0.6.8.tar.xz -C source

  - |
      echo "[COGMAN] Building kube-hunter Python package, sir."
      cd source/kube-hunter-0.6.8
      python3 setup.py build

