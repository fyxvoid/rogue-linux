steps:
  - rm -rf source build
  - mkdir -p source build

  - |
      echo "[COGMAN] Extracting trufflehog source, sir."
      tar -xf tar/trufflehog-3.68.0.tar.xz -C source

  - |
      echo "[COGMAN] Building trufflehog with Go, sir."
      cd source/trufflehog-3.68.0
      go build -o ../../build/ ./...

