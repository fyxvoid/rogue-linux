steps:
  - rm -rf source build
  - mkdir -p source build

  - |
      echo "[COGMAN] Extracting bundler-audit source, sir."
      tar -xf tar/bundler-audit-0.9.1.tar.xz -C source

  - |
      echo "[COGMAN] Building bundler-audit Python package, sir."
      cd source/bundler-audit-0.9.1
      python3 setup.py build

