steps:
  - rm -rf source build
  - mkdir -p source build

  - |
      echo "[COGMAN] Extracting openvas-scanner source, sir."
      tar -xf tar/openvas-scanner-23.0.1.tar.xz -C source

  - |
      echo "[COGMAN] Configuring openvas-scanner with CMake, sir."
      cd build
      cmake ../source/openvas-scanner-23.0.1 -DCMAKE_INSTALL_PREFIX=/usr -DCMAKE_BUILD_TYPE=Release

