steps:
  - rm -rf source build
  - mkdir -p source build

  - |
      echo "[COGMAN] Extracting kubeaudit source, sir."
      tar -xf tar/kubeaudit-0.22.1.tar.xz -C source

  - |
      echo "[COGMAN] Building kubeaudit with Go, sir."
      cd source/kubeaudit-0.22.1
      go build -o ../../build/ ./...

