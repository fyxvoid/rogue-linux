steps:
  - rm -rf source build
  - mkdir -p source build

  - |
      echo "[COGMAN] Extracting linkfinder source, sir."
      tar -xf tar/linkfinder-1.2.tar.xz -C source

  - |
      echo "[COGMAN] Building linkfinder Python package, sir."
      cd source/linkfinder-1.2
      python3 setup.py build

