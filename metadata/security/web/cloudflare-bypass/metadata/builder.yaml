steps:
  - rm -rf source build
  - mkdir -p source build

  - |
      echo "[COGMAN] Extracting cloudflare-bypass source, sir."
      tar -xf tar/cloudflare-bypass-1.0.tar.xz -C source

  - |
      echo "[COGMAN] Building cloudflare-bypass Python package, sir."
      cd source/cloudflare-bypass-1.0
      python3 setup.py build

