steps:
  - rm -rf source build
  - mkdir -p source build

  - |
      echo "[COGMAN] Extracting cors-scanner source, sir."
      tar -xf tar/cors-scanner-1.0.tar.xz -C source

  - |
      echo "[COGMAN] Building cors-scanner Python package, sir."
      cd source/cors-scanner-1.0
      python3 setup.py build

