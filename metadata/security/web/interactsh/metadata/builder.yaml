steps:
  - rm -rf source build
  - mkdir -p source build

  - |
      echo "[COGMAN] Extracting interactsh source, sir."
      tar -xf tar/interactsh-1.1.9.tar.xz -C source

  - |
      echo "[COGMAN] Building interactsh with Go, sir."
      cd source/interactsh-1.1.9
      go build -o ../../build/ ./...

