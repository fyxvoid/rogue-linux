steps:
  - rm -rf source build
  - mkdir -p source build

  - |
      echo "[COGMAN] Extracting slowloris source, sir."
      tar -xf tar/slowloris-0.2.2.tar.xz -C source

  - |
      echo "[COGMAN] Building slowloris Python package, sir."
      cd source/slowloris-0.2.2
      python3 setup.py build

