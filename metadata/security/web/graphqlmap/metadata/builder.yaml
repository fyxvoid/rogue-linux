steps:
  - rm -rf source build
  - mkdir -p source build

  - |
      echo "[COGMAN] Extracting graphqlmap source, sir."
      tar -xf tar/graphqlmap-1.0.1.tar.xz -C source

  - |
      echo "[COGMAN] Building graphqlmap Python package, sir."
      cd source/graphqlmap-1.0.1
      python3 setup.py build

