steps:
  - rm -rf source build
  - mkdir -p source build

  - |
      echo "[COGMAN] Extracting openredirex source, sir."
      tar -xf tar/openredirex-1.0.tar.xz -C source

  - |
      echo "[COGMAN] Building openredirex Python package, sir."
      cd source/openredirex-1.0
      python3 setup.py build

