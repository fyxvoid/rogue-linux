steps:
  - rm -rf source build
  - mkdir -p source build

  - |
      echo "[COGMAN] Extracting dirsearch source, sir."
      tar -xf tar/dirsearch-0.4.3.tar.xz -C source

  - |
      echo "[COGMAN] Building dirsearch Python package, sir."
      cd source/dirsearch-0.4.3
      python3 setup.py build

