steps:
  - rm -rf source build
  - mkdir -p source build

  - |
      echo "[COGMAN] Extracting feroxbuster source, sir."
      tar -xf tar/feroxbuster-2.10.2.tar.xz -C source

  - |
      echo "[COGMAN] Building feroxbuster with Cargo, sir."
      cd source/feroxbuster-2.10.2
      cargo build --release

