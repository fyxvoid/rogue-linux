steps:
  - rm -rf source build
  - mkdir -p source build

  - |
      echo "[COGMAN] Extracting content-provider-tools source, sir."
      tar -xf tar/content-provider-tools-1.0.tar.xz -C source

  - |
      echo "[COGMAN] Building content-provider-tools Python package, sir."
      cd source/content-provider-tools-1.0
      python3 setup.py build

