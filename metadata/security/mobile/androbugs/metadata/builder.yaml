steps:
  - rm -rf source build
  - mkdir -p source build

  - |
      echo "[COGMAN] Extracting androbugs source, sir."
      tar -xf tar/androbugs-2.1.0.tar.xz -C source

  - |
      echo "[COGMAN] Building androbugs Python package, sir."
      cd source/androbugs-2.1.0
      python3 setup.py build

