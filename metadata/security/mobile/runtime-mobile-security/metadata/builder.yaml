steps:
  - rm -rf source build
  - mkdir -p source build

  - |
      echo "[COGMAN] Extracting runtime-mobile-security source, sir."
      tar -xf tar/runtime-mobile-security-1.0.tar.xz -C source

  - |
      echo "[COGMAN] Building runtime-mobile-security Python package, sir."
      cd source/runtime-mobile-security-1.0
      python3 setup.py build

