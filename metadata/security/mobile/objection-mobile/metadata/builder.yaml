steps:
  - rm -rf source build
  - mkdir -p source build

  - |
      echo "[COGMAN] Extracting objection-mobile source, sir."
      tar -xf tar/objection-mobile-1.11.0.tar.xz -C source

  - |
      echo "[COGMAN] Building objection-mobile Python package, sir."
      cd source/objection-mobile-1.11.0
      python3 setup.py build

