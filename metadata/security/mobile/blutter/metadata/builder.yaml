steps:
  - rm -rf source build
  - mkdir -p source build

  - |
      echo "[COGMAN] Extracting blutter source, sir."
      tar -xf tar/blutter-1.0.tar.xz -C source

  - |
      echo "[COGMAN] Configuring blutter with CMake, sir."
      cd build
      cmake ../source/blutter-1.0 -DCMAKE_INSTALL_PREFIX=/usr -DCMAKE_BUILD_TYPE=Release

