steps:
  - rm -rf source build
  - mkdir -p source build

  - |
      echo "[COGMAN] Extracting exodus-cli source, sir."
      tar -xf tar/exodus-cli-2.5.0.tar.xz -C source

  - |
      echo "[COGMAN] Building exodus-cli Python package, sir."
      cd source/exodus-cli-2.5.0
      python3 setup.py build

