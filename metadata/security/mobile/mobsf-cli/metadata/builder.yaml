steps:
  - rm -rf source build
  - mkdir -p source build

  - |
      echo "[COGMAN] Extracting mobsf-cli source, sir."
      tar -xf tar/mobsf-cli-3.9.3.tar.xz -C source

  - |
      echo "[COGMAN] Building mobsf-cli Python package, sir."
      cd source/mobsf-cli-3.9.3
      python3 setup.py build

