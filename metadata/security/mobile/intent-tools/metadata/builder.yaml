steps:
  - rm -rf source build
  - mkdir -p source build

  - |
      echo "[COGMAN] Extracting intent-tools source, sir."
      tar -xf tar/intent-tools-1.0.tar.xz -C source

  - |
      echo "[COGMAN] Building intent-tools Python package, sir."
      cd source/intent-tools-1.0
      python3 setup.py build

