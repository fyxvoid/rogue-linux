steps:
  - rm -rf source build
  - mkdir -p source build

  - |
      echo "[COGMAN] Extracting ssl-pinning-bypass source, sir."
      tar -xf tar/ssl-pinning-bypass-1.0.tar.xz -C source

  - |
      echo "[COGMAN] Building ssl-pinning-bypass Python package, sir."
      cd source/ssl-pinning-bypass-1.0
      python3 setup.py build

