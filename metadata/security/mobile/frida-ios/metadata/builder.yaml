steps:
  - rm -rf source build
  - mkdir -p source build

  - |
      echo "[COGMAN] Extracting frida-ios source, sir."
      tar -xf tar/frida-ios-16.1.11.tar.xz -C source

  - |
      echo "[COGMAN] Building frida-ios Python package, sir."
      cd source/frida-ios-16.1.11
      python3 setup.py build

