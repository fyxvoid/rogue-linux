steps:
  - rm -rf source build
  - mkdir -p source build

  - |
      echo "[COGMAN] Extracting mariana-trench source, sir."
      tar -xf tar/mariana-trench-1.0.4.tar.xz -C source

  - |
      echo "[COGMAN] Building mariana-trench Python package, sir."
      cd source/mariana-trench-1.0.4
      python3 setup.py build

