steps:
  - rm -rf source build
  - mkdir -p source build

  - |
      echo "[COGMAN] Extracting medusa-mobile source, sir."
      tar -xf tar/medusa-mobile-2.0.tar.xz -C source

  - |
      echo "[COGMAN] Building medusa-mobile Python package, sir."
      cd source/medusa-mobile-2.0
      python3 setup.py build

