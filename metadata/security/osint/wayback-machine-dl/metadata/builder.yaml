steps:
  - rm -rf source build
  - mkdir -p source build

  - |
      echo "[COGMAN] Extracting wayback-machine-dl source, sir."
      tar -xf tar/wayback-machine-dl-1.0.tar.xz -C source

  - |
      echo "[COGMAN] Building wayback-machine-dl Python package, sir."
      cd source/wayback-machine-dl-1.0
      python3 setup.py build

