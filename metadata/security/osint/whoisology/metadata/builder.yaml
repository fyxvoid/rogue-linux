steps:
  - rm -rf source build
  - mkdir -p source build

  - |
      echo "[COGMAN] Extracting whoisology source, sir."
      tar -xf tar/whoisology-1.0.tar.xz -C source

  - |
      echo "[COGMAN] Building whoisology Python package, sir."
      cd source/whoisology-1.0
      python3 setup.py build

