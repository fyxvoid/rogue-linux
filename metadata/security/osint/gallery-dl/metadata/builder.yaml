steps:
  - rm -rf source build
  - mkdir -p source build

  - |
      echo "[COGMAN] Extracting gallery-dl source, sir."
      tar -xf tar/gallery-dl-1.26.8.tar.xz -C source

  - |
      echo "[COGMAN] Building gallery-dl Python package, sir."
      cd source/gallery-dl-1.26.8
      python3 setup.py build

