steps:
  - rm -rf source build
  - mkdir -p source build

  - |
      echo "[COGMAN] Extracting urlscan-cli source, sir."
      tar -xf tar/urlscan-cli-1.0.tar.xz -C source

  - |
      echo "[COGMAN] Building urlscan-cli Python package, sir."
      cd source/urlscan-cli-1.0
      python3 setup.py build

