steps:
  - rm -rf source build
  - mkdir -p source build

  - |
      echo "[COGMAN] Extracting socialscan source, sir."
      tar -xf tar/socialscan-2.0.0.tar.xz -C source

  - |
      echo "[COGMAN] Building socialscan Python package, sir."
      cd source/socialscan-2.0.0
      python3 setup.py build

