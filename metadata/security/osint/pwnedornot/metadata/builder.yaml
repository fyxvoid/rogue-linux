steps:
  - rm -rf source build
  - mkdir -p source build

  - |
      echo "[COGMAN] Extracting pwnedornot source, sir."
      tar -xf tar/pwnedornot-1.3.5.tar.xz -C source

  - |
      echo "[COGMAN] Building pwnedornot Python package, sir."
      cd source/pwnedornot-1.3.5
      python3 setup.py build

