steps:
  - rm -rf source build
  - mkdir -p source build

  - |
      echo "[COGMAN] Extracting osrframework source, sir."
      tar -xf tar/osrframework-0.20.3.tar.xz -C source

  - |
      echo "[COGMAN] Building osrframework Python package, sir."
      cd source/osrframework-0.20.3
      python3 setup.py build

