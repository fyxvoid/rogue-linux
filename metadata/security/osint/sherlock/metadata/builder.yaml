steps:
  - rm -rf source build
  - mkdir -p source build

  - |
      echo "[COGMAN] Extracting sherlock source, sir."
      tar -xf tar/sherlock-0.14.3.tar.xz -C source

  - |
      echo "[COGMAN] Building sherlock Python package, sir."
      cd source/sherlock-0.14.3
      python3 setup.py build

