steps:
  - rm -rf source build
  - mkdir -p source build

  - |
      echo "[COGMAN] Extracting metagoofil source, sir."
      tar -xf tar/metagoofil-2.2.tar.xz -C source

  - |
      echo "[COGMAN] Building metagoofil Python package, sir."
      cd source/metagoofil-2.2
      python3 setup.py build

