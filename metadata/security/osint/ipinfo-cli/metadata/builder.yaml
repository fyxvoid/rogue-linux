steps:
  - rm -rf source build
  - mkdir -p source build

  - |
      echo "[COGMAN] Extracting ipinfo-cli source, sir."
      tar -xf tar/ipinfo-cli-3.3.0.tar.xz -C source

  - |
      echo "[COGMAN] Building ipinfo-cli with Go, sir."
      cd source/ipinfo-cli-3.3.0
      go build -o ../../build/ ./...

