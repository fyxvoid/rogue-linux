steps:
  - rm -rf source build
  - mkdir -p source build

  - |
      echo "[COGMAN] Extracting gitleaks-osint source, sir."
      tar -xf tar/gitleaks-osint-8.18.2.tar.xz -C source

  - |
      echo "[COGMAN] Building gitleaks-osint with Go, sir."
      cd source/gitleaks-osint-8.18.2
      go build -o ../../build/ ./...

