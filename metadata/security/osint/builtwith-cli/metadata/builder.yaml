steps:
  - rm -rf source build
  - mkdir -p source build

  - |
      echo "[COGMAN] Extracting builtwith-cli source, sir."
      tar -xf tar/builtwith-cli-1.0.tar.xz -C source

  - |
      echo "[COGMAN] Building builtwith-cli Python package, sir."
      cd source/builtwith-cli-1.0
      python3 setup.py build

