steps:
  - rm -rf source build
  - mkdir -p source build

  - |
      echo "[COGMAN] Extracting finalrecon source, sir."
      tar -xf tar/finalrecon-1.1.5.tar.xz -C source

  - |
      echo "[COGMAN] Building finalrecon Python package, sir."
      cd source/finalrecon-1.1.5
      python3 setup.py build

