steps:
  - rm -rf source build
  - mkdir -p source build

  - |
      echo "[COGMAN] Extracting email2phonenumber source, sir."
      tar -xf tar/email2phonenumber-1.0.tar.xz -C source

  - |
      echo "[COGMAN] Building email2phonenumber Python package, sir."
      cd source/email2phonenumber-1.0
      python3 setup.py build

