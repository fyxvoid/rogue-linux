steps:
  - rm -rf source build
  - mkdir -p source build

  - |
      echo "[COGMAN] Extracting fierce-osint source, sir."
      tar -xf tar/fierce-osint-1.5.0.tar.xz -C source

  - |
      echo "[COGMAN] Building fierce-osint Python package, sir."
      cd source/fierce-osint-1.5.0
      python3 setup.py build

