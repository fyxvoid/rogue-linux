steps:
  - rm -rf source build
  - mkdir -p source build

  - |
      echo "[COGMAN] Extracting spyse-cli source, sir."
      tar -xf tar/spyse-cli-1.3.0.tar.xz -C source

  - |
      echo "[COGMAN] Building spyse-cli Python package, sir."
      cd source/spyse-cli-1.3.0
      python3 setup.py build

