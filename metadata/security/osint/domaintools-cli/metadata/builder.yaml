steps:
  - rm -rf source build
  - mkdir -p source build

  - |
      echo "[COGMAN] Extracting domaintools-cli source, sir."
      tar -xf tar/domaintools-cli-1.0.tar.xz -C source

  - |
      echo "[COGMAN] Building domaintools-cli Python package, sir."
      cd source/domaintools-cli-1.0
      python3 setup.py build

