steps:
  - rm -rf source build
  - mkdir -p source build

  - |
      echo "[COGMAN] Extracting whoisxmlapi-cli source, sir."
      tar -xf tar/whoisxmlapi-cli-1.0.tar.xz -C source

  - |
      echo "[COGMAN] Building whoisxmlapi-cli Python package, sir."
      cd source/whoisxmlapi-cli-1.0
      python3 setup.py build

