steps:
  - rm -rf source build
  - mkdir -p source build

  - |
      echo "[COGMAN] Extracting dnstwist source, sir."
      tar -xf tar/dnstwist-20240116.tar.xz -C source

  - |
      echo "[COGMAN] Building dnstwist Python package, sir."
      cd source/dnstwist-20240116
      python3 setup.py build

