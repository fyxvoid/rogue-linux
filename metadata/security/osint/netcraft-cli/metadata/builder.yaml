steps:
  - rm -rf source build
  - mkdir -p source build

  - |
      echo "[COGMAN] Extracting netcraft-cli source, sir."
      tar -xf tar/netcraft-cli-1.0.tar.xz -C source

  - |
      echo "[COGMAN] Building netcraft-cli Python package, sir."
      cd source/netcraft-cli-1.0
      python3 setup.py build

