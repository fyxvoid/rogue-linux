steps:
  - rm -rf source build
  - mkdir -p source build

  - |
      echo "[COGMAN] Extracting photon-osint source, sir."
      tar -xf tar/photon-osint-1.3.2.tar.xz -C source

  - |
      echo "[COGMAN] Building photon-osint Python package, sir."
      cd source/photon-osint-1.3.2
      python3 setup.py build

