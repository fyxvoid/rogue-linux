steps:
  - rm -rf source build
  - mkdir -p source build

  - |
      echo "[COGMAN] Extracting datasploit source, sir."
      tar -xf tar/datasploit-2.0.0.tar.xz -C source

  - |
      echo "[COGMAN] Building datasploit Python package, sir."
      cd source/datasploit-2.0.0
      python3 setup.py build

