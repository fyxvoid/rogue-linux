steps:
  - rm -rf source build
  - mkdir -p source build

  - |
      echo "[COGMAN] Extracting whatsmyname source, sir."
      tar -xf tar/whatsmyname-1.0.tar.xz -C source

  - |
      echo "[COGMAN] Building whatsmyname Python package, sir."
      cd source/whatsmyname-1.0
      python3 setup.py build

