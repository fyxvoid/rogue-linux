steps:
  - rm -rf source build
  - mkdir -p source build

  - |
      echo "[COGMAN] Extracting mailsniper source, sir."
      tar -xf tar/mailsniper-1.0.tar.xz -C source

  - |
      echo "[COGMAN] Building mailsniper Python package, sir."
      cd source/mailsniper-1.0
      python3 setup.py build

