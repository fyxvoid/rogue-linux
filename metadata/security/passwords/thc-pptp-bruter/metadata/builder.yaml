steps:
  - rm -rf source build
  - mkdir -p source build

  - |
      echo "[COGMAN] Extracting thc-pptp-bruter source, sir."
      tar -xf tar/thc-pptp-bruter-0.1.4.tar.xz -C source

  - |
      echo "[COGMAN] Building thc-pptp-bruter, sir."
      cd source/thc-pptp-bruter-0.1.4
      make -j$(nproc)

