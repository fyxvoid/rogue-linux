steps:
  - rm -rf source build
  - mkdir -p source build

  - |
      echo "[COGMAN] Extracting trevorspray source, sir."
      tar -xf tar/trevorspray-2.2.2.tar.xz -C source

  - |
      echo "[COGMAN] Building trevorspray Python package, sir."
      cd source/trevorspray-2.2.2
      python3 setup.py build

