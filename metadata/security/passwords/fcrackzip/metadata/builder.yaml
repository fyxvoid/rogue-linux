steps:
  - rm -rf source build
  - mkdir -p source build

  - |
      echo "[COGMAN] Extracting fcrackzip source, sir."
      tar -xf tar/fcrackzip-1.0.tar.xz -C source

  - |
      echo "[COGMAN] Configuring fcrackzip, sir."
      cd build
      ../source/fcrackzip-1.0/configure --prefix=/usr \
        

