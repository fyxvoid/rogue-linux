steps:
  - rm -rf source build
  - mkdir -p source build

  - |
      echo "[COGMAN] Extracting sprayhound source, sir."
      tar -xf tar/sprayhound-0.1.0.tar.xz -C source

  - |
      echo "[COGMAN] Building sprayhound Python package, sir."
      cd source/sprayhound-0.1.0
      python3 setup.py build

