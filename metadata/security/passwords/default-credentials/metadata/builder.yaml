steps:
  - rm -rf source build
  - mkdir -p source build

  - |
      echo "[COGMAN] Extracting default-credentials source, sir."
      tar -xf tar/default-credentials-1.0.tar.xz -C source

  - |
      echo "[COGMAN] Building default-credentials, sir."
      cd source/default-credentials-1.0
      make -j$(nproc)

