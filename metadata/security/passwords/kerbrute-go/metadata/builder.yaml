steps:
  - rm -rf source build
  - mkdir -p source build

  - |
      echo "[COGMAN] Extracting kerbrute-go source, sir."
      tar -xf tar/kerbrute-go-1.0.3.tar.xz -C source

  - |
      echo "[COGMAN] Building kerbrute-go with Go, sir."
      cd source/kerbrute-go-1.0.3
      go build -o ../../build/ ./...

