steps:
  - rm -rf source build
  - mkdir -p source build

  - |
      echo "[COGMAN] Extracting domi-owned source, sir."
      tar -xf tar/domi-owned-1.0.tar.xz -C source

  - |
      echo "[COGMAN] Building domi-owned Python package, sir."
      cd source/domi-owned-1.0
      python3 setup.py build

