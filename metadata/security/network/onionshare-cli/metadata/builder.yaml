steps:
  - rm -rf source build
  - mkdir -p source build

  - |
      echo "[COGMAN] Extracting onionshare-cli source, sir."
      tar -xf tar/onionshare-cli-2.6.2.tar.xz -C source

  - |
      echo "[COGMAN] Building onionshare-cli Python package, sir."
      cd source/onionshare-cli-2.6.2
      python3 setup.py build

