steps:
  - rm -rf source build
  - mkdir -p source build

  - |
      echo "[COGMAN] Extracting dnscrypt-proxy-sec source, sir."
      tar -xf tar/dnscrypt-proxy-sec-2.1.5.tar.xz -C source

  - |
      echo "[COGMAN] Building dnscrypt-proxy-sec with Go, sir."
      cd source/dnscrypt-proxy-sec-2.1.5
      go build -o ../../build/ ./...

