steps:
  - rm -rf source build
  - mkdir -p source build

  - |
      echo "[COGMAN] Extracting wireguard-sec source, sir."
      tar -xf tar/wireguard-sec-1.0.20210914.tar.xz -C source

  - |
      echo "[COGMAN] Building wireguard-sec, sir."
      cd source/wireguard-sec-1.0.20210914
      make -j$(nproc)

