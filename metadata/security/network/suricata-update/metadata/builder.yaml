steps:
  - rm -rf source build
  - mkdir -p source build

  - |
      echo "[COGMAN] Extracting suricata-update source, sir."
      tar -xf tar/suricata-update-1.3.2.tar.xz -C source

  - |
      echo "[COGMAN] Building suricata-update Python package, sir."
      cd source/suricata-update-1.3.2
      python3 setup.py build

