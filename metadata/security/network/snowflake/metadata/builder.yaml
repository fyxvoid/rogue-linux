steps:
  - rm -rf source build
  - mkdir -p source build

  - |
      echo "[COGMAN] Extracting snowflake source, sir."
      tar -xf tar/snowflake-2.9.2.tar.xz -C source

  - |
      echo "[COGMAN] Building snowflake with Go, sir."
      cd source/snowflake-2.9.2
      go build -o ../../build/ ./...

