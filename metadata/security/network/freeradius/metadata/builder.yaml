steps:
  - rm -rf source build
  - mkdir -p source build

  - |
      echo "[COGMAN] Extracting freeradius source, sir."
      tar -xf tar/freeradius-3.2.3.tar.xz -C source

  - |
      echo "[COGMAN] Configuring freeradius, sir."
      cd build
      ../source/freeradius-3.2.3/configure --prefix=/usr \
        --sysconfdir=/etc

