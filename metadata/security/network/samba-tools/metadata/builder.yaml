steps:
  - rm -rf source build
  - mkdir -p source build

  - |
      echo "[COGMAN] Extracting samba-tools source, sir."
      tar -xf tar/samba-tools-4.19.4.tar.xz -C source

  - |
      echo "[COGMAN] Configuring samba-tools, sir."
      cd build
      ../source/samba-tools-4.19.4/configure --prefix=/usr \
        --sysconfdir=/etc

