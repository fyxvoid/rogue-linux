steps:
  - rm -rf source build
  - mkdir -p source build

  - |
      echo "[COGMAN] Extracting privoxy source, sir."
      tar -xf tar/privoxy-3.0.34.tar.xz -C source

  - |
      echo "[COGMAN] Configuring privoxy, sir."
      cd build
      ../source/privoxy-3.0.34/configure --prefix=/usr \
        --sysconfdir=/etc

