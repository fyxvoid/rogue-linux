steps:
  - rm -rf source build
  - mkdir -p source build

  - |
      echo "[COGMAN] Extracting openldap source, sir."
      tar -xf tar/openldap-2.6.7.tar.xz -C source

  - |
      echo "[COGMAN] Configuring openldap, sir."
      cd build
      ../source/openldap-2.6.7/configure --prefix=/usr \
        --sysconfdir=/etc

