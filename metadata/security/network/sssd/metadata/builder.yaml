steps:
  - rm -rf source build
  - mkdir -p source build

  - |
      echo "[COGMAN] Extracting sssd source, sir."
      tar -xf tar/sssd-2.9.4.tar.xz -C source

  - |
      echo "[COGMAN] Configuring sssd with CMake, sir."
      cd build
      cmake ../source/sssd-2.9.4 -DCMAKE_INSTALL_PREFIX=/usr -DCMAKE_BUILD_TYPE=Release

