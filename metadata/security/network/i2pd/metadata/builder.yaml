steps:
  - rm -rf source build
  - mkdir -p source build

  - |
      echo "[COGMAN] Extracting i2pd source, sir."
      tar -xf tar/i2pd-2.50.2.tar.xz -C source

  - |
      echo "[COGMAN] Configuring i2pd with CMake, sir."
      cd build
      cmake ../source/i2pd-2.50.2 -DCMAKE_INSTALL_PREFIX=/usr -DCMAKE_BUILD_TYPE=Release

