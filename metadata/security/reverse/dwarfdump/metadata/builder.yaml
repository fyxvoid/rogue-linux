steps:
  - rm -rf source build
  - mkdir -p source build

  - |
      echo "[COGMAN] Extracting dwarfdump source, sir."
      tar -xf tar/dwarfdump-0.9.2.tar.xz -C source

  - |
      echo "[COGMAN] Configuring dwarfdump, sir."
      cd build
      ../source/dwarfdump-0.9.2/configure --prefix=/usr \
        

