steps:
  - rm -rf source build
  - mkdir -p source build

  - |
      echo "[COGMAN] Extracting pwndbg source, sir."
      tar -xf tar/pwndbg-2024.02.14.tar.xz -C source

  - |
      echo "[COGMAN] Building pwndbg Python package, sir."
      cd source/pwndbg-2024.02.14
      python3 setup.py build

