steps:
  - rm -rf source build
  - mkdir -p source build

  - |
      echo "[COGMAN] Extracting triton source, sir."
      tar -xf tar/triton-1.0.tar.xz -C source

  - |
      echo "[COGMAN] Configuring triton with CMake, sir."
      cd build
      cmake ../source/triton-1.0 -DCMAKE_INSTALL_PREFIX=/usr -DCMAKE_BUILD_TYPE=Release

