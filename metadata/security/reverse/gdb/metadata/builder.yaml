steps:
  - rm -rf source build
  - mkdir -p source build

  - |
      echo "[COGMAN] Extracting gdb source, sir."
      tar -xf tar/gdb-14.1.tar.xz -C source

  - |
      echo "[COGMAN] Configuring gdb, sir."
      cd build
      ../source/gdb-14.1/configure --prefix=/usr \
        --with-python=/usr/bin/python3 \
        --with-system-readline

