steps:
  - rm -rf source build
  - mkdir -p source build

  - |
      echo "[COGMAN] Extracting keystone source, sir."
      tar -xf tar/keystone-0.9.2.tar.xz -C source

  - |
      echo "[COGMAN] Configuring keystone with CMake, sir."
      cd build
      cmake ../source/keystone-0.9.2 -DCMAKE_INSTALL_PREFIX=/usr -DCMAKE_BUILD_TYPE=Release

