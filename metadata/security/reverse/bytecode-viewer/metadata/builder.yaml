steps:
  - rm -rf source build
  - mkdir -p source build

  - |
      echo "[COGMAN] Extracting bytecode-viewer source, sir."
      tar -xf tar/bytecode-viewer-2.12.tar.xz -C source

  - |
      echo "[COGMAN] Building bytecode-viewer, sir."
      cd source/bytecode-viewer-2.12
      make -j$(nproc)

