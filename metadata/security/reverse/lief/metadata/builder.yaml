steps:
  - rm -rf source build
  - mkdir -p source build

  - |
      echo "[COGMAN] Extracting lief source, sir."
      tar -xf tar/lief-0.14.1.tar.xz -C source

  - |
      echo "[COGMAN] Configuring lief with CMake, sir."
      cd build
      cmake ../source/lief-0.14.1 -DCMAKE_INSTALL_PREFIX=/usr -DCMAKE_BUILD_TYPE=Release

