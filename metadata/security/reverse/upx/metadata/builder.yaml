steps:
  - rm -rf source build
  - mkdir -p source build

  - |
      echo "[COGMAN] Extracting upx source, sir."
      tar -xf tar/upx-4.2.2.tar.xz -C source

  - |
      echo "[COGMAN] Configuring upx with CMake, sir."
      cd build
      cmake ../source/upx-4.2.2 -DCMAKE_INSTALL_PREFIX=/usr -DCMAKE_BUILD_TYPE=Release

