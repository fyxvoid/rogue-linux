steps:
  - rm -rf source build
  - mkdir -p source build

  - |
      echo "[COGMAN] Extracting capstone source, sir."
      tar -xf tar/capstone-5.0.1.tar.xz -C source

  - |
      echo "[COGMAN] Configuring capstone with CMake, sir."
      cd build
      cmake ../source/capstone-5.0.1 -DCMAKE_INSTALL_PREFIX=/usr -DCMAKE_BUILD_TYPE=Release

