steps:
  - rm -rf source build
  - mkdir -p source build

  - |
      echo "[COGMAN] Extracting objection source, sir."
      tar -xf tar/objection-1.11.0.tar.xz -C source

  - |
      echo "[COGMAN] Building objection Python package, sir."
      cd source/objection-1.11.0
      python3 setup.py build

