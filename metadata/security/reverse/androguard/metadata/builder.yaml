steps:
  - rm -rf source build
  - mkdir -p source build

  - |
      echo "[COGMAN] Extracting androguard source, sir."
      tar -xf tar/androguard-3.4.0.tar.xz -C source

  - |
      echo "[COGMAN] Building androguard Python package, sir."
      cd source/androguard-3.4.0
      python3 setup.py build

