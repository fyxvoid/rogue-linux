steps:
  - rm -rf source build
  - mkdir -p source build

  - |
      echo "[COGMAN] Extracting binutils-dev source, sir."
      tar -xf tar/binutils-dev-2.42.tar.xz -C source

  - |
      echo "[COGMAN] Configuring binutils-dev, sir."
      cd build
      ../source/binutils-dev-2.42/configure --prefix=/usr \
        --enable-shared

