steps:
  - rm -rf source build
  - mkdir -p source build

  - |
      echo "[COGMAN] Extracting z3-solver source, sir."
      tar -xf tar/z3-solver-4.12.6.tar.xz -C source

  - |
      echo "[COGMAN] Configuring z3-solver with CMake, sir."
      cd build
      cmake ../source/z3-solver-4.12.6 -DCMAKE_INSTALL_PREFIX=/usr -DCMAKE_BUILD_TYPE=Release

