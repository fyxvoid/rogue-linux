steps:
  - rm -rf source build
  - mkdir -p source build

  - |
      echo "[COGMAN] Extracting r2ghidra source, sir."
      tar -xf tar/r2ghidra-5.8.8.tar.xz -C source

  - |
      echo "[COGMAN] Configuring r2ghidra with CMake, sir."
      cd build
      cmake ../source/r2ghidra-5.8.8 -DCMAKE_INSTALL_PREFIX=/usr -DCMAKE_BUILD_TYPE=Release

