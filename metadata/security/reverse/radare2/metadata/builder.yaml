steps:
  - rm -rf source build
  - mkdir -p source build

  - |
      echo "[COGMAN] Extracting radare2 source, sir."
      tar -xf tar/radare2-5.8.8.tar.xz -C source

  - |
      echo "[COGMAN] Configuring radare2 with Meson, sir."
      cd build
      meson setup ../source/radare2-5.8.8 . --prefix=/usr --buildtype=release

