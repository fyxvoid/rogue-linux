steps:
  - rm -rf source build
  - mkdir -p source build

  - |
      echo "[COGMAN] Extracting snowman source, sir."
      tar -xf tar/snowman-0.1.3.tar.xz -C source

  - |
      echo "[COGMAN] Configuring snowman with CMake, sir."
      cd build
      cmake ../source/snowman-0.1.3 -DCMAKE_INSTALL_PREFIX=/usr -DCMAKE_BUILD_TYPE=Release

