steps:
  - rm -rf source build
  - mkdir -p source build

  - |
      echo "[COGMAN] Extracting unicorn-engine source, sir."
      tar -xf tar/unicorn-engine-2.0.1.tar.xz -C source

  - |
      echo "[COGMAN] Configuring unicorn-engine with CMake, sir."
      cd build
      cmake ../source/unicorn-engine-2.0.1 -DCMAKE_INSTALL_PREFIX=/usr -DCMAKE_BUILD_TYPE=Release

