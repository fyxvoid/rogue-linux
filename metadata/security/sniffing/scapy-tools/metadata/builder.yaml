steps:
  - rm -rf source build
  - mkdir -p source build

  - |
      echo "[COGMAN] Extracting scapy-tools source, sir."
      tar -xf tar/scapy-tools-2.5.0.tar.xz -C source

  - |
      echo "[COGMAN] Building scapy-tools Python package, sir."
      cd source/scapy-tools-2.5.0
      python3 setup.py build

