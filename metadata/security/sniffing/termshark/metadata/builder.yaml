steps:
  - rm -rf source build
  - mkdir -p source build

  - |
      echo "[COGMAN] Extracting termshark source, sir."
      tar -xf tar/termshark-2.4.0.tar.xz -C source

  - |
      echo "[COGMAN] Building termshark with Go, sir."
      cd source/termshark-2.4.0
      go build -o ../../build/ ./...

