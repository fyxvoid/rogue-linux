steps:
  - rm -rf source build
  - mkdir -p source build

  - |
      echo "[COGMAN] Extracting lldpd source, sir."
      tar -xf tar/lldpd-1.0.17.tar.xz -C source

  - |
      echo "[COGMAN] Configuring lldpd, sir."
      cd build
      ../source/lldpd-1.0.17/configure --prefix=/usr \
        --sysconfdir=/etc

