steps:
  - rm -rf source build
  - mkdir -p source build

  - |
      echo "[COGMAN] Extracting apparmor-utils source, sir."
      tar -xf tar/apparmor-utils-3.1.7.tar.xz -C source

  - |
      echo "[COGMAN] Building apparmor-utils, sir."
      cd source/apparmor-utils-3.1.7
      make -j$(nproc)

