steps:
  - rm -rf source build
  - mkdir -p source build

  - |
      echo "[COGMAN] Extracting pi-hole-ftl source, sir."
      tar -xf tar/pi-hole-ftl-5.25.1.tar.xz -C source

  - |
      echo "[COGMAN] Configuring pi-hole-ftl with CMake, sir."
      cd build
      cmake ../source/pi-hole-ftl-5.25.1 -DCMAKE_INSTALL_PREFIX=/usr -DCMAKE_BUILD_TYPE=Release

