steps:
  - rm -rf source build
  - mkdir -p source build

  - |
      echo "[COGMAN] Extracting zeek source, sir."
      tar -xf tar/zeek-6.2.0.tar.xz -C source

  - |
      echo "[COGMAN] Configuring zeek with CMake, sir."
      cd build
      cmake ../source/zeek-6.2.0 -DCMAKE_INSTALL_PREFIX=/usr -DCMAKE_BUILD_TYPE=Release

