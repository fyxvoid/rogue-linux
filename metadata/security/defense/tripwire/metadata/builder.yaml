steps:
  - rm -rf source build
  - mkdir -p source build

  - |
      echo "[COGMAN] Extracting tripwire source, sir."
      tar -xf tar/tripwire-2.4.3.7.tar.xz -C source

  - |
      echo "[COGMAN] Configuring tripwire, sir."
      cd build
      ../source/tripwire-2.4.3.7/configure --prefix=/usr \
        --sysconfdir=/etc

