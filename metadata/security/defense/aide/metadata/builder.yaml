steps:
  - rm -rf source build
  - mkdir -p source build

  - |
      echo "[COGMAN] Extracting aide source, sir."
      tar -xf tar/aide-0.18.6.tar.xz -C source

  - |
      echo "[COGMAN] Configuring aide, sir."
      cd build
      ../source/aide-0.18.6/configure --prefix=/usr \
        --sysconfdir=/etc

