steps:
  - rm -rf source build
  - mkdir -p source build

  - |
      echo "[COGMAN] Extracting wazuh-agent source, sir."
      tar -xf tar/wazuh-agent-4.7.2.tar.xz -C source

  - |
      echo "[COGMAN] Configuring wazuh-agent with CMake, sir."
      cd build
      cmake ../source/wazuh-agent-4.7.2 -DCMAKE_INSTALL_PREFIX=/usr -DCMAKE_BUILD_TYPE=Release

