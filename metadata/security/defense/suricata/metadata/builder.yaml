steps:
  - rm -rf source build
  - mkdir -p source build

  - |
      echo "[COGMAN] Extracting suricata source, sir."
      tar -xf tar/suricata-7.0.3.tar.xz -C source

  - |
      echo "[COGMAN] Configuring suricata, sir."
      cd build
      ../source/suricata-7.0.3/configure --prefix=/usr \
        --sysconfdir=/etc \
        --enable-nfqueue

