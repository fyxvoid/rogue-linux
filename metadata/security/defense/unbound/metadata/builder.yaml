steps:
  - rm -rf source build
  - mkdir -p source build

  - |
      echo "[COGMAN] Extracting unbound source, sir."
      tar -xf tar/unbound-1.19.1.tar.xz -C source

  - |
      echo "[COGMAN] Configuring unbound, sir."
      cd build
      ../source/unbound-1.19.1/configure --prefix=/usr \
        --sysconfdir=/etc \
        --with-conf-file=/etc/unbound/unbound.conf

