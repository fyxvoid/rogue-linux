steps:
  - rm -rf source build
  - mkdir -p source build

  - |
      echo "[COGMAN] Extracting step-cli source, sir."
      tar -xf tar/step-cli-0.25.2.tar.xz -C source

  - |
      echo "[COGMAN] Building step-cli with Go, sir."
      cd source/step-cli-0.25.2
      go build -o ../../build/ ./...

