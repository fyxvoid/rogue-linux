steps:
  - rm -rf source build
  - mkdir -p source build

  - |
      echo "[COGMAN] Extracting snort3 source, sir."
      tar -xf tar/snort3-3.1.80.0.tar.xz -C source

  - |
      echo "[COGMAN] Configuring snort3 with CMake, sir."
      cd build
      cmake ../source/snort3-3.1.80.0 -DCMAKE_INSTALL_PREFIX=/usr -DCMAKE_BUILD_TYPE=Release

