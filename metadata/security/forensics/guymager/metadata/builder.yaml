steps:
  - rm -rf source build
  - mkdir -p source build

  - |
      echo "[COGMAN] Extracting guymager source, sir."
      tar -xf tar/guymager-0.8.13.tar.xz -C source

  - |
      echo "[COGMAN] Configuring guymager with CMake, sir."
      cd build
      cmake ../source/guymager-0.8.13 -DCMAKE_INSTALL_PREFIX=/usr -DCMAKE_BUILD_TYPE=Release

