steps:
  - rm -rf source build
  - mkdir -p source build

  - |
      echo "[COGMAN] Extracting volatility2 source, sir."
      tar -xf tar/volatility2-2.6.1.tar.xz -C source

  - |
      echo "[COGMAN] Building volatility2 Python package, sir."
      cd source/volatility2-2.6.1
      python3 setup.py build

