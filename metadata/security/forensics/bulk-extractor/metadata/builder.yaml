steps:
  - rm -rf source build
  - mkdir -p source build

  - |
      echo "[COGMAN] Extracting bulk-extractor source, sir."
      tar -xf tar/bulk-extractor-2.0.5.tar.xz -C source

  - |
      echo "[COGMAN] Configuring bulk-extractor with CMake, sir."
      cd build
      cmake ../source/bulk-extractor-2.0.5 -DCMAKE_INSTALL_PREFIX=/usr -DCMAKE_BUILD_TYPE=Release

