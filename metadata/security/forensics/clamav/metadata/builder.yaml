steps:
  - rm -rf source build
  - mkdir -p source build

  - |
      echo "[COGMAN] Extracting clamav source, sir."
      tar -xf tar/clamav-1.3.0.tar.xz -C source

  - |
      echo "[COGMAN] Configuring clamav with CMake, sir."
      cd build
      cmake ../source/clamav-1.3.0 -DCMAKE_INSTALL_PREFIX=/usr -DCMAKE_BUILD_TYPE=Release

