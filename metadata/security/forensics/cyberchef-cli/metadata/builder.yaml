steps:
  - rm -rf source build
  - mkdir -p source build

  - |
      echo "[COGMAN] Extracting cyberchef-cli source, sir."
      tar -xf tar/cyberchef-cli-10.10.0.tar.xz -C source

  - |
      echo "[COGMAN] Building cyberchef-cli, sir."
      cd source/cyberchef-cli-10.10.0
      make -j$(nproc)

