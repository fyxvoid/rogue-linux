steps:
  - rm -rf source build
  - mkdir -p source build

  - |
      echo "[COGMAN] Extracting sleuthkit source, sir."
      tar -xf tar/sleuthkit-4.12.1.tar.xz -C source

  - |
      echo "[COGMAN] Configuring sleuthkit, sir."
      cd build
      ../source/sleuthkit-4.12.1/configure --prefix=/usr \
        

