  - mkdir -p source build

  - |
      echo "[COGMAN] Extracting ddrescue source, sir."
      tar -xf tar/ddrescue-1.28.tar.xz -C source

  - |
      echo "[COGMAN] Configuring ddrescue, sir."
      cd build
      ../source/ddrescue-1.28/configure --prefix=/usr \
        

