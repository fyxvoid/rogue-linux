steps:
  - rm -rf source build
  - mkdir -p source build

  - |
      echo "[COGMAN] Extracting osquery source, sir."
      tar -xf tar/osquery-5.11.0.tar.xz -C source

  - |
      echo "[COGMAN] Configuring osquery with CMake, sir."
      cd build
      cmake ../source/osquery-5.11.0 -DCMAKE_INSTALL_PREFIX=/usr -DCMAKE_BUILD_TYPE=Release

