steps:
  - rm -rf source build
  - mkdir -p source build

  - |
      echo "[COGMAN] Extracting pdf-parser source, sir."
      tar -xf tar/pdf-parser-0.7.8.tar.xz -C source

  - |
      echo "[COGMAN] Building pdf-parser Python package, sir."
      cd source/pdf-parser-0.7.8
      python3 setup.py build

