steps:
  - rm -rf source build
  - mkdir -p source build

  - |
      echo "[COGMAN] Extracting volatility3 source, sir."
      tar -xf tar/volatility3-2.5.2.tar.xz -C source

  - |
      echo "[COGMAN] Building volatility3 Python package, sir."
      cd source/volatility3-2.5.2
      python3 setup.py build

