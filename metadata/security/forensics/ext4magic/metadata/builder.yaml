  - mkdir -p source build

  - |
      echo "[COGMAN] Extracting ext4magic source, sir."
      tar -xf tar/ext4magic-0.3.1.tar.xz -C source

  - |
      echo "[COGMAN] Configuring ext4magic, sir."
      cd build
      ../source/ext4magic-0.3.1/configure --prefix=/usr \
        

