steps:
  - rm -rf source build
  - mkdir -p source build

  - |
      echo "[COGMAN] Extracting stegseek source, sir."
      tar -xf tar/stegseek-0.6.tar.xz -C source

  - |
      echo "[COGMAN] Configuring stegseek with CMake, sir."
      cd build
      cmake ../source/stegseek-0.6 -DCMAKE_INSTALL_PREFIX=/usr -DCMAKE_BUILD_TYPE=Release

