steps:
  - rm -rf source build
  - mkdir -p source build

  - |
      echo "[COGMAN] Extracting oletools source, sir."
      tar -xf tar/oletools-0.60.1.tar.xz -C source

  - |
      echo "[COGMAN] Building oletools Python package, sir."
      cd source/oletools-0.60.1
      python3 setup.py build

