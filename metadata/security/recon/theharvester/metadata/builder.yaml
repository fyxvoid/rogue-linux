steps:
  - rm -rf source build
  - mkdir -p source build

  - |
      echo "[COGMAN] Extracting theharvester source, sir."
      tar -xf tar/theharvester-4.6.0.tar.xz -C source

  - |
      echo "[COGMAN] Building theharvester Python package, sir."
      cd source/theharvester-4.6.0
      python3 setup.py build

