steps:
  - rm -rf source build
  - mkdir -p source build

  - |
      echo "[COGMAN] Extracting spiderfoot source, sir."
      tar -xf tar/spiderfoot-4.0.0.tar.xz -C source

  - |
      echo "[COGMAN] Building spiderfoot Python package, sir."
      cd source/spiderfoot-4.0.0
      python3 setup.py build

