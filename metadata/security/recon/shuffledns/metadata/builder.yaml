steps:
  - rm -rf source build
  - mkdir -p source build

  - |
      echo "[COGMAN] Extracting shuffledns source, sir."
      tar -xf tar/shuffledns-1.1.0.tar.xz -C source

  - |
      echo "[COGMAN] Building shuffledns with Go, sir."
      cd source/shuffledns-1.1.0
      go build -o ../../build/ ./...

