steps:
  - rm -rf source build
  - mkdir -p source build

  - |
      echo "[COGMAN] Extracting libnet source, sir."
      tar -xf tar/libnet-1.2.tar.xz -C source

  - |
      echo "[COGMAN] Configuring libnet, sir."
      cd build
      ../source/libnet-1.2/configure --prefix=/usr \
        --disable-static

