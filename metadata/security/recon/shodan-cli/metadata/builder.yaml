steps:
  - rm -rf source build
  - mkdir -p source build

  - |
      echo "[COGMAN] Extracting shodan-cli source, sir."
      tar -xf tar/shodan-cli-1.31.0.tar.xz -C source

  - |
      echo "[COGMAN] Building shodan-cli Python package, sir."
      cd source/shodan-cli-1.31.0
      python3 setup.py build

