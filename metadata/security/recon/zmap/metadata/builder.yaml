steps:
  - rm -rf source build
  - mkdir -p source build

  - |
      echo "[COGMAN] Extracting zmap source, sir."
      tar -xf tar/zmap-4.1.0.tar.xz -C source

  - |
      echo "[COGMAN] Configuring zmap with CMake, sir."
      cd build
      cmake ../source/zmap-4.1.0 -DCMAKE_INSTALL_PREFIX=/usr -DCMAKE_BUILD_TYPE=Release

