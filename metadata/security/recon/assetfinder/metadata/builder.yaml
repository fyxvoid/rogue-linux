steps:
  - rm -rf source build
  - mkdir -p source build

  - |
      echo "[COGMAN] Extracting assetfinder source, sir."
      tar -xf tar/assetfinder-0.1.1.tar.xz -C source

  - |
      echo "[COGMAN] Building assetfinder with Go, sir."
      cd source/assetfinder-0.1.1
      go build -o ../../build/ ./...

