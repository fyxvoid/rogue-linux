steps:
  - rm -rf source build
  - mkdir -p source build

  - |
      echo "[COGMAN] Extracting chaos-client source, sir."
      tar -xf tar/chaos-client-0.5.1.tar.xz -C source

  - |
      echo "[COGMAN] Building chaos-client with Go, sir."
      cd source/chaos-client-0.5.1
      go build -o ../../build/ ./...

