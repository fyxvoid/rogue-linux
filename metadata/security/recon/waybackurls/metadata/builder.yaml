steps:
  - rm -rf source build
  - mkdir -p source build

  - |
      echo "[COGMAN] Extracting waybackurls source, sir."
      tar -xf tar/waybackurls-0.1.0.tar.xz -C source

  - |
      echo "[COGMAN] Building waybackurls with Go, sir."
      cd source/waybackurls-0.1.0
      go build -o ../../build/ ./...

