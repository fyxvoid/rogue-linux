steps:
  - rm -rf source build
  - mkdir -p source build

  - |
      echo "[COGMAN] Extracting censys-cli source, sir."
      tar -xf tar/censys-cli-2.2.10.tar.xz -C source

  - |
      echo "[COGMAN] Building censys-cli Python package, sir."
      cd source/censys-cli-2.2.10
      python3 setup.py build

