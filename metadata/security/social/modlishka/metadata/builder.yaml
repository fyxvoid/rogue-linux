steps:
  - rm -rf source build
  - mkdir -p source build

  - |
      echo "[COGMAN] Extracting modlishka source, sir."
      tar -xf tar/modlishka-1.1.0.tar.xz -C source

  - |
      echo "[COGMAN] Building modlishka with Go, sir."
      cd source/modlishka-1.1.0
      go build -o ../../build/ ./...

