steps:
  - rm -rf source build
  - mkdir -p source build

  - |
      echo "[COGMAN] Extracting evilginx2 source, sir."
      tar -xf tar/evilginx2-3.3.0.tar.xz -C source

  - |
      echo "[COGMAN] Building evilginx2 with Go, sir."
      cd source/evilginx2-3.3.0
      go build -o ../../build/ ./...

