steps:
  - rm -rf source build
  - mkdir -p source build

  - |
      echo "[COGMAN] Extracting credential-harvester source, sir."
      tar -xf tar/credential-harvester-1.0.tar.xz -C source

  - |
      echo "[COGMAN] Building credential-harvester Python package, sir."
      cd source/credential-harvester-1.0
      python3 setup.py build

