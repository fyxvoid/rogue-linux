steps:
  - rm -rf source build
  - mkdir -p source build

  - |
      echo "[COGMAN] Extracting socialfish source, sir."
      tar -xf tar/socialfish-3.0.tar.xz -C source

  - |
      echo "[COGMAN] Building socialfish Python package, sir."
      cd source/socialfish-3.0
      python3 setup.py build

