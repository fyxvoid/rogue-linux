steps:
  - rm -rf source build
  - mkdir -p source build

  - |
      echo "[COGMAN] Extracting setoolkit source, sir."
      tar -xf tar/setoolkit-8.0.3.tar.xz -C source

  - |
      echo "[COGMAN] Building setoolkit Python package, sir."
      cd source/setoolkit-8.0.3
      python3 setup.py build

