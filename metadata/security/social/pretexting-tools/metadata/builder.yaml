steps:
  - rm -rf source build
  - mkdir -p source build

  - |
      echo "[COGMAN] Extracting pretexting-tools source, sir."
      tar -xf tar/pretexting-tools-1.0.tar.xz -C source

  - |
      echo "[COGMAN] Building pretexting-tools Python package, sir."
      cd source/pretexting-tools-1.0
      python3 setup.py build

