steps:
  - rm -rf source build
  - mkdir -p source build

  - |
      echo "[COGMAN] Extracting phishing-frenzy source, sir."
      tar -xf tar/phishing-frenzy-1.0.tar.xz -C source

  - |
      echo "[COGMAN] Building phishing-frenzy, sir."
      cd source/phishing-frenzy-1.0
      make -j$(nproc)

