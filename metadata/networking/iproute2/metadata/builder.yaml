steps:
  - |
    echo "[COGMAN] Extracting iproute2 source, sir."
    tar -xf tar/iproute2-6.7.0.tar.xz -C source --strip-components=1

  - |
    echo "[COGMAN] Preparing iproute2 build configuration, sir."
    sed -i 's|^PREFIX=.*|PREFIX=/usr|' source/Makefile
    sed -i 's|^SBINDIR=.*|SBINDIR=/usr/bin|' source/Makefile
    sed -i 's|^LIBDIR=.*|LIBDIR=/usr/lib|' source/Makefile

  - |
    echo "[COGMAN] Building iproute2, sir."
    cd source
    make
