steps:
  - rm -rf source build
  - mkdir -p source build

  - |
      echo "[COGMAN] Extracting wireless-tools source, sir."
      tar -xf tar/wireless-tools-30.pre9.tar.xz -C source

  - |
      echo "[COGMAN] Building wireless-tools, sir."
      cd source/wireless-tools-30.pre9
      make -j$(nproc)

