steps:
  - rm -rf source build
  - mkdir -p source build

  - |
      echo "[COGMAN] Extracting mtr source, sir."
      tar -xf tar/mtr-0.95.tar.xz -C source

  - |
      echo "[COGMAN] Configuring mtr with Meson, sir."
      cd build
      meson setup ../source/mtr-0.95 . --prefix=/usr --buildtype=release

