steps:
  - rm -rf source build
  - mkdir -p source build

  - |
      echo "[COGMAN] Extracting iptables source, sir."
      tar -xf tar/iptables-1.8.10.tar.xz -C source

  - |
      echo "[COGMAN] Configuring iptables, sir."
      cd build
      ../source/iptables-1.8.10/configure --prefix=/usr \
        --disable-nftables

