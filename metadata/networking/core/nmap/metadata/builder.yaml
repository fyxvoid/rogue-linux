steps:
  - rm -rf source build
  - mkdir -p source build

  - |
      echo "[COGMAN] Extracting nmap source, sir."
      tar -xf tar/nmap-7.95.tar.xz -C source

  - |
      echo "[COGMAN] Configuring nmap, sir."
      cd build
      ../source/nmap-7.95/configure --prefix=/usr \
        --with-libpcap=yes \
        --with-openssl=yes \
        --with-libnl=yes

