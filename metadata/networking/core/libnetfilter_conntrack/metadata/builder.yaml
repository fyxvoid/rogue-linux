steps:
  - rm -rf source build
  - mkdir -p source build

  - |
      echo "[COGMAN] Extracting libnetfilter_conntrack source, sir."
      tar -xf tar/libnetfilter_conntrack-1.0.9.tar.xz -C source

  - |
      echo "[COGMAN] Configuring libnetfilter_conntrack, sir."
      cd build
      ../source/libnetfilter_conntrack-1.0.9/configure --prefix=/usr \
        --disable-static

