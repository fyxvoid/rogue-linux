steps:
  - rm -rf source build
  - mkdir -p source build

  - |
      echo "[COGMAN] Extracting rsync source, sir."
      tar -xf tar/rsync-3.2.7.tar.xz -C source

  - |
      echo "[COGMAN] Configuring rsync, sir."
      cd build
      ../source/rsync-3.2.7/configure --prefix=/usr \
        --disable-debug

