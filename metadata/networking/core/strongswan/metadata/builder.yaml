steps:
  - rm -rf source build
  - mkdir -p source build

  - |
      echo "[COGMAN] Extracting strongswan source, sir."
      tar -xf tar/strongswan-5.9.14.tar.xz -C source

  - |
      echo "[COGMAN] Configuring strongswan, sir."
      cd build
      ../source/strongswan-5.9.14/configure --prefix=/usr \
        --sysconfdir=/etc \
        --enable-openssl

