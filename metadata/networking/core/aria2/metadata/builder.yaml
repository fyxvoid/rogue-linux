steps:
  - rm -rf source build
  - mkdir -p source build

  - |
      echo "[COGMAN] Extracting aria2 source, sir."
      tar -xf tar/aria2-1.37.0.tar.xz -C source

  - |
      echo "[COGMAN] Configuring aria2, sir."
      cd build
      ../source/aria2-1.37.0/configure --prefix=/usr \
        --enable-bittorrent \
        --enable-metalink

