steps:
  - rm -rf source build
  - mkdir -p source build

  - |
      echo "[COGMAN] Extracting wireguard-tools source, sir."
      tar -xf tar/wireguard-tools-1.0.20210914.tar.xz -C source

  - |
      echo "[COGMAN] Building wireguard-tools, sir."
      cd source/wireguard-tools-1.0.20210914
      make -j$(nproc)

