steps:
  - rm -rf source build
  - mkdir -p source build

  - |
      echo "[COGMAN] Extracting nginx source, sir."
      tar -xf tar/nginx-1.25.4.tar.xz -C source

  - |
      echo "[COGMAN] Configuring nginx, sir."
      cd build
      ../source/nginx-1.25.4/configure --prefix=/usr \
        --conf-path=/etc/nginx/nginx.conf \
        --with-http_ssl_module \
        --with-http_v2_module \
        --with-pcre

