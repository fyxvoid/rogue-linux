steps:
  - rm -rf source build
  - mkdir -p source build

  - |
      echo "[COGMAN] Extracting libnfnetlink source, sir."
      tar -xf tar/libnfnetlink-1.0.2.tar.xz -C source

  - |
      echo "[COGMAN] Configuring libnfnetlink, sir."
      cd build
      ../source/libnfnetlink-1.0.2/configure --prefix=/usr \
        --disable-static

