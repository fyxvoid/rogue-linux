steps:
  - rm -rf source build
  - mkdir -p source build

  - |
      echo "[COGMAN] Extracting dhcpcd source, sir."
      tar -xf tar/dhcpcd-10.0.6.tar.xz -C source

  - |
      echo "[COGMAN] Configuring dhcpcd, sir."
      cd build
      ../source/dhcpcd-10.0.6/configure --prefix=/usr \
        --sysconfdir=/etc

