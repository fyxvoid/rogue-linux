steps:
  - rm -rf source build
  - mkdir -p source build

  - |
      echo "[COGMAN] Extracting chrony source, sir."
      tar -xf tar/chrony-4.5.tar.xz -C source

  - |
      echo "[COGMAN] Configuring chrony, sir."
      cd build
      ../source/chrony-4.5/configure --prefix=/usr \
        --sysconfdir=/etc

