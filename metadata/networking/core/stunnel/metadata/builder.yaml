steps:
  - rm -rf source build
  - mkdir -p source build

  - |
      echo "[COGMAN] Extracting stunnel source, sir."
      tar -xf tar/stunnel-5.72.tar.xz -C source

  - |
      echo "[COGMAN] Configuring stunnel, sir."
      cd build
      ../source/stunnel-5.72/configure --prefix=/usr \
        --sysconfdir=/etc

