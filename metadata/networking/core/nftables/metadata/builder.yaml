steps:
  - rm -rf source build
  - mkdir -p source build

  - |
      echo "[COGMAN] Extracting nftables source, sir."
      tar -xf tar/nftables-1.0.9.tar.xz -C source

  - |
      echo "[COGMAN] Configuring nftables, sir."
      cd build
      ../source/nftables-1.0.9/configure --prefix=/usr \
        --sysconfdir=/etc

