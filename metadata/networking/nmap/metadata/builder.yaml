steps:
  - |
    echo "[COGMAN] Extracting nmap source, sir."
    tar -xf tar/nmap-7.98.tar.bz2 -C source --strip-components=1

  - |
    echo "[COGMAN] Configuring nmap, sir."
    cd source
    ./configure \
      --prefix=/usr \
      --with-libpcap=yes \
      --with-openssl=yes \
      --with-libnl=yes

  - |
    echo "[COGMAN] Building nmap, sir."
    cd source
    make
