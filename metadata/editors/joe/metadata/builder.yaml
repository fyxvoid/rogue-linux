steps:
  - rm -rf source build
  - mkdir -p source build

  - |
      echo "[COGMAN] Extracting joe source, sir."
      tar -xf tar/joe-4.6.tar.xz -C source

  - |
      echo "[COGMAN] Configuring joe, sir."
      cd build
      ../source/joe-4.6/configure --prefix=/usr \
        --sysconfdir=/etc

