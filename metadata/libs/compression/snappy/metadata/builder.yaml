steps:
  - rm -rf source build
  - mkdir -p source build

  - |
      echo "[COGMAN] Extracting snappy source, sir."
      tar -xf tar/snappy-1.2.0.tar.xz -C source

  - |
      echo "[COGMAN] Configuring snappy with CMake, sir."
      cd build
      cmake ../source/snappy-1.2.0 -DCMAKE_INSTALL_PREFIX=/usr -DCMAKE_BUILD_TYPE=Release

