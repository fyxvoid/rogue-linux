steps:
  - rm -rf source build
  - mkdir -p source build

  - |
      echo "[COGMAN] Extracting brotli source, sir."
      tar -xf tar/brotli-1.1.0.tar.xz -C source

  - |
      echo "[COGMAN] Configuring brotli with CMake, sir."
      cd build
      cmake ../source/brotli-1.1.0 -DCMAKE_INSTALL_PREFIX=/usr -DCMAKE_BUILD_TYPE=Release

