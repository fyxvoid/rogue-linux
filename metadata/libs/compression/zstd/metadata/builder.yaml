steps:
  - rm -rf source build
  - mkdir -p source build

  - |
      echo "[COGMAN] Extracting zstd source, sir."
      tar -xf tar/zstd-1.5.5.tar.xz -C source

  - |
      echo "[COGMAN] Configuring zstd with CMake, sir."
      cd build
      cmake ../source/zstd-1.5.5 -DCMAKE_INSTALL_PREFIX=/usr -DCMAKE_BUILD_TYPE=Release

