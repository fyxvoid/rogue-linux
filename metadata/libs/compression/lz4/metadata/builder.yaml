steps:
  - rm -rf source build
  - mkdir -p source build

  - |
      echo "[COGMAN] Extracting lz4 source, sir."
      tar -xf tar/lz4-1.9.4.tar.xz -C source

  - |
      echo "[COGMAN] Configuring lz4 with CMake, sir."
      cd build
      cmake ../source/lz4-1.9.4 -DCMAKE_INSTALL_PREFIX=/usr -DCMAKE_BUILD_TYPE=Release

