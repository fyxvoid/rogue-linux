steps:
  - rm -rf source build
  - mkdir -p source build

  - |
      echo "[COGMAN] Extracting libwebp source, sir."
      tar -xf tar/libwebp-1.3.2.tar.xz -C source

  - |
      echo "[COGMAN] Configuring libwebp with CMake, sir."
      cd build
      cmake ../source/libwebp-1.3.2 -DCMAKE_INSTALL_PREFIX=/usr -DCMAKE_BUILD_TYPE=Release

