steps:
  - rm -rf source build
  - mkdir -p source build

  - |
      echo "[COGMAN] Extracting libmicrohttpd source, sir."
      tar -xf tar/libmicrohttpd-1.0.0.tar.xz -C source

  - |
      echo "[COGMAN] Configuring libmicrohttpd, sir."
      cd build
      ../source/libmicrohttpd-1.0.0/configure --prefix=/usr \
        --disable-static

