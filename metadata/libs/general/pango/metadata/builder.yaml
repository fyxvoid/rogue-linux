steps:
  - rm -rf source build
  - mkdir -p source build

  - |
      echo "[COGMAN] Extracting pango source, sir."
      tar -xf tar/pango-1.52.1.tar.xz -C source

  - |
      echo "[COGMAN] Configuring pango with Meson, sir."
      cd build
      meson setup ../source/pango-1.52.1 . --prefix=/usr --buildtype=release

