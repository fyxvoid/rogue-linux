steps:
  - rm -rf source build
  - mkdir -p source build

  - |
      echo "[COGMAN] Extracting oniguruma source, sir."
      tar -xf tar/oniguruma-6.9.9.tar.xz -C source

  - |
      echo "[COGMAN] Configuring oniguruma, sir."
      cd build
      ../source/oniguruma-6.9.9/configure --prefix=/usr \
        --disable-static

