steps:
  - rm -rf source build
  - mkdir -p source build

  - |
      echo "[COGMAN] Extracting libzip source, sir."
      tar -xf tar/libzip-1.10.1.tar.xz -C source

  - |
      echo "[COGMAN] Configuring libzip with CMake, sir."
      cd build
      cmake ../source/libzip-1.10.1 -DCMAKE_INSTALL_PREFIX=/usr -DCMAKE_BUILD_TYPE=Release

