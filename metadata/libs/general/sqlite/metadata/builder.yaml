steps:
  - rm -rf source build
  - mkdir -p source build

  - |
      echo "[COGMAN] Extracting sqlite source, sir."
      tar -xf tar/sqlite-3.45.1.tar.xz -C source

  - |
      echo "[COGMAN] Configuring sqlite, sir."
      cd build
      ../source/sqlite-3.45.1/configure --prefix=/usr \
        --disable-static \
        --enable-fts5

