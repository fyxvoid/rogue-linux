steps:
  - rm -rf source build
  - mkdir -p source build

  - |
      echo "[COGMAN] Extracting libxslt source, sir."
      tar -xf tar/libxslt-1.1.39.tar.xz -C source

  - |
      echo "[COGMAN] Configuring libxslt, sir."
      cd build
      ../source/libxslt-1.1.39/configure --prefix=/usr \
        --disable-static

