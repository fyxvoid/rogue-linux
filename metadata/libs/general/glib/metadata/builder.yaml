steps:
  - rm -rf source build
  - mkdir -p source build

  - |
      echo "[COGMAN] Extracting glib source, sir."
      tar -xf tar/glib-2.80.0.tar.xz -C source

  - |
      echo "[COGMAN] Configuring glib with Meson, sir."
      cd build
      meson setup ../source/glib-2.80.0 . --prefix=/usr --buildtype=release

