steps:
  - rm -rf source build
  - mkdir -p source build

  - |
      echo "[COGMAN] Extracting check source, sir."
      tar -xf tar/check-0.15.2.tar.xz -C source

  - |
      echo "[COGMAN] Configuring check, sir."
      cd build
      ../source/check-0.15.2/configure --prefix=/usr \
        --disable-static

