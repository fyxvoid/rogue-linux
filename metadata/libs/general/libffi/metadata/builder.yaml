steps:
  - rm -rf source build
  - mkdir -p source build

  - |
      echo "[COGMAN] Extracting libffi source, sir."
      tar -xf tar/libffi-3.4.6.tar.xz -C source

  - |
      echo "[COGMAN] Configuring libffi, sir."
      cd build
      ../source/libffi-3.4.6/configure --prefix=/usr \
        --disable-static

