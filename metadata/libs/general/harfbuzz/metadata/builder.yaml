steps:
  - rm -rf source build
  - mkdir -p source build

  - |
      echo "[COGMAN] Extracting harfbuzz source, sir."
      tar -xf tar/harfbuzz-8.3.0.tar.xz -C source

  - |
      echo "[COGMAN] Configuring harfbuzz with Meson, sir."
      cd build
      meson setup ../source/harfbuzz-8.3.0 . --prefix=/usr --buildtype=release

