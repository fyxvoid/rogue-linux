steps:
  - rm -rf source build
  - mkdir -p source build

  - |
      echo "[COGMAN] Extracting libev source, sir."
      tar -xf tar/libev-4.33.tar.xz -C source

  - |
      echo "[COGMAN] Configuring libev, sir."
      cd build
      ../source/libev-4.33/configure --prefix=/usr \
        --disable-static

