steps:
  - rm -rf source build
  - mkdir -p source build

  - |
      echo "[COGMAN] Extracting graphite2 source, sir."
      tar -xf tar/graphite2-1.3.14.tar.xz -C source

  - |
      echo "[COGMAN] Configuring graphite2 with CMake, sir."
      cd build
      cmake ../source/graphite2-1.3.14 -DCMAKE_INSTALL_PREFIX=/usr -DCMAKE_BUILD_TYPE=Release

