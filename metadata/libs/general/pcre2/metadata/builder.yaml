steps:
  - rm -rf source build
  - mkdir -p source build

  - |
      echo "[COGMAN] Extracting pcre2 source, sir."
      tar -xf tar/pcre2-10.43.tar.xz -C source

  - |
      echo "[COGMAN] Configuring pcre2, sir."
      cd build
      ../source/pcre2-10.43/configure --prefix=/usr \
        --enable-unicode \
        --enable-jit \
        --enable-pcre2-16 \
        --enable-pcre2-32 \
        --enable-pcre2grep-libz \
        --enable-pcre2grep-libbz2 \
        --enable-pcre2test-libreadline \
        --disable-static

