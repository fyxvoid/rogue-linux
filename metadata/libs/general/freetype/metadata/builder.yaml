steps:
  - rm -rf source build
  - mkdir -p source build

  - |
      echo "[COGMAN] Extracting freetype source, sir."
      tar -xf tar/freetype-2.13.2.tar.xz -C source

  - |
      echo "[COGMAN] Configuring freetype, sir."
      cd build
      ../source/freetype-2.13.2/configure --prefix=/usr \
        --enable-freetype-config \
        --disable-static

