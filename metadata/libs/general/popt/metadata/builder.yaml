steps:
  - rm -rf source build
  - mkdir -p source build

  - |
      echo "[COGMAN] Extracting popt source, sir."
      tar -xf tar/popt-1.19.tar.xz -C source

  - |
      echo "[COGMAN] Configuring popt, sir."
      cd build
      ../source/popt-1.19/configure --prefix=/usr \
        --disable-static

