steps:
  - rm -rf source build
  - mkdir -p source build

  - |
      echo "[COGMAN] Extracting wget source, sir."
      tar -xf tar/wget-1.24.5.tar.xz -C source

  - |
      echo "[COGMAN] Configuring wget, sir."
      cd build
      ../source/wget-1.24.5/configure --prefix=/usr \
        --sysconfdir=/etc \
        --with-ssl=openssl

