steps:
  - rm -rf source build
  - mkdir -p source build

  - |
      echo "[COGMAN] Extracting libpng source, sir."
      tar -xf tar/libpng-1.6.43.tar.xz -C source

  - |
      echo "[COGMAN] Configuring libpng, sir."
      cd build
      ../source/libpng-1.6.43/configure --prefix=/usr \
        --disable-static

