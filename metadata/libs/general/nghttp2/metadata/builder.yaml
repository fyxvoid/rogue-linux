steps:
  - rm -rf source build
  - mkdir -p source build

  - |
      echo "[COGMAN] Extracting nghttp2 source, sir."
      tar -xf tar/nghttp2-1.59.0.tar.xz -C source

  - |
      echo "[COGMAN] Configuring nghttp2, sir."
      cd build
      ../source/nghttp2-1.59.0/configure --prefix=/usr \
        --disable-static \
        --enable-lib-only

