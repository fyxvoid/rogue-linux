steps:
  - rm -rf source build
  - mkdir -p source build

  - |
      echo "[COGMAN] Extracting jansson source, sir."
      tar -xf tar/jansson-2.14.tar.xz -C source

  - |
      echo "[COGMAN] Configuring jansson with CMake, sir."
      cd build
      cmake ../source/jansson-2.14 -DCMAKE_INSTALL_PREFIX=/usr -DCMAKE_BUILD_TYPE=Release

