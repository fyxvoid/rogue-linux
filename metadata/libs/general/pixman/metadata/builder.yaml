steps:
  - rm -rf source build
  - mkdir -p source build

  - |
      echo "[COGMAN] Extracting pixman source, sir."
      tar -xf tar/pixman-0.43.2.tar.xz -C source

  - |
      echo "[COGMAN] Configuring pixman with Meson, sir."
      cd build
      meson setup ../source/pixman-0.43.2 . --prefix=/usr --buildtype=release

