steps:
  - rm -rf source build
  - mkdir -p source build

  - |
      echo "[COGMAN] Extracting libxml2 source, sir."
      tar -xf tar/libxml2-2.12.5.tar.xz -C source

  - |
      echo "[COGMAN] Configuring libxml2, sir."
      cd build
      ../source/libxml2-2.12.5/configure --prefix=/usr \
        --disable-static \
        --with-history \
        --with-icu

