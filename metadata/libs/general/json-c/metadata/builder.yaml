steps:
  - rm -rf source build
  - mkdir -p source build

  - |
      echo "[COGMAN] Extracting json-c source, sir."
      tar -xf tar/json-c-0.17.tar.xz -C source

  - |
      echo "[COGMAN] Configuring json-c with CMake, sir."
      cd build
      cmake ../source/json-c-0.17 -DCMAKE_INSTALL_PREFIX=/usr -DCMAKE_BUILD_TYPE=Release

