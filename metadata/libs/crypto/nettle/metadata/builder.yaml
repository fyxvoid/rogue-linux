steps:
  - rm -rf source build
  - mkdir -p source build

  - |
      echo "[COGMAN] Extracting nettle source, sir."
      tar -xf tar/nettle-3.9.1.tar.xz -C source

  - |
      echo "[COGMAN] Configuring nettle, sir."
      cd build
      ../source/nettle-3.9.1/configure --prefix=/usr \
        --disable-static

