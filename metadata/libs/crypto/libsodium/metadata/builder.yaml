steps:
  - rm -rf source build
  - mkdir -p source build

  - |
      echo "[COGMAN] Extracting libsodium source, sir."
      tar -xf tar/libsodium-1.0.19.tar.xz -C source

  - |
      echo "[COGMAN] Configuring libsodium, sir."
      cd build
      ../source/libsodium-1.0.19/configure --prefix=/usr \
        --disable-static

