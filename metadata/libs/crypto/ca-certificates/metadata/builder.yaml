steps:
  - rm -rf source build
  - mkdir -p source build

  - |
      echo "[COGMAN] Extracting ca-certificates source, sir."
      tar -xf tar/ca-certificates-20240203.tar.xz -C source

  - |
      echo "[COGMAN] Building ca-certificates, sir."
      cd source/ca-certificates-20240203
      make -j$(nproc)

