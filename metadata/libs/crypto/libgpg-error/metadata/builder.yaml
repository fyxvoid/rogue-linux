steps:
  - rm -rf source build
  - mkdir -p source build

  - |
      echo "[COGMAN] Extracting libgpg-error source, sir."
      tar -xf tar/libgpg-error-1.48.tar.xz -C source

  - |
      echo "[COGMAN] Configuring libgpg-error, sir."
      cd build
      ../source/libgpg-error-1.48/configure --prefix=/usr \
        --disable-static

