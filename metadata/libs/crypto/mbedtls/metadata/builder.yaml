steps:
  - rm -rf source build
  - mkdir -p source build

  - |
      echo "[COGMAN] Extracting mbedtls source, sir."
      tar -xf tar/mbedtls-3.5.2.tar.xz -C source

  - |
      echo "[COGMAN] Configuring mbedtls with CMake, sir."
      cd build
      cmake ../source/mbedtls-3.5.2 -DCMAKE_INSTALL_PREFIX=/usr -DCMAKE_BUILD_TYPE=Release

