steps:
  - rm -rf source build
  - mkdir -p source build

  - |
      echo "[COGMAN] Extracting gpgme source, sir."
      tar -xf tar/gpgme-1.23.2.tar.xz -C source

  - |
      echo "[COGMAN] Configuring gpgme, sir."
      cd build
      ../source/gpgme-1.23.2/configure --prefix=/usr \
        --disable-static

