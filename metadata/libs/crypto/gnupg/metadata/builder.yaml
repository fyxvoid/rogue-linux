steps:
  - rm -rf source build
  - mkdir -p source build

  - |
      echo "[COGMAN] Extracting gnupg source, sir."
      tar -xf tar/gnupg-2.4.4.tar.xz -C source

  - |
      echo "[COGMAN] Configuring gnupg, sir."
      cd build
      ../source/gnupg-2.4.4/configure --prefix=/usr \
        --sysconfdir=/etc

