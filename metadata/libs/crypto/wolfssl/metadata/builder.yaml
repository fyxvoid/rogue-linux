steps:
  - rm -rf source build
  - mkdir -p source build

  - |
      echo "[COGMAN] Extracting wolfssl source, sir."
      tar -xf tar/wolfssl-5.6.6.tar.xz -C source

  - |
      echo "[COGMAN] Configuring wolfssl, sir."
      cd build
      ../source/wolfssl-5.6.6/configure --prefix=/usr \
        --enable-all

