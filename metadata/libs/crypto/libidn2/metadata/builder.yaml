steps:
  - rm -rf source build
  - mkdir -p source build

  - |
      echo "[COGMAN] Extracting libidn2 source, sir."
      tar -xf tar/libidn2-2.3.7.tar.xz -C source

  - |
      echo "[COGMAN] Configuring libidn2, sir."
      cd build
      ../source/libidn2-2.3.7/configure --prefix=/usr \
        --disable-static

