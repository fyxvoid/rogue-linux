steps:
  - rm -rf source build
  - mkdir -p source build

  - |
      echo "[COGMAN] Extracting libgcrypt source, sir."
      tar -xf tar/libgcrypt-1.10.3.tar.xz -C source

  - |
      echo "[COGMAN] Configuring libgcrypt, sir."
      cd build
      ../source/libgcrypt-1.10.3/configure --prefix=/usr \
        --disable-static

