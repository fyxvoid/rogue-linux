steps:
  - rm -rf source build
  - mkdir -p source build

  - |
      echo "[COGMAN] Extracting libssh source, sir."
      tar -xf tar/libssh-0.10.6.tar.xz -C source

  - |
      echo "[COGMAN] Configuring libssh with CMake, sir."
      cd build
      cmake ../source/libssh-0.10.6 -DCMAKE_INSTALL_PREFIX=/usr -DCMAKE_BUILD_TYPE=Release

