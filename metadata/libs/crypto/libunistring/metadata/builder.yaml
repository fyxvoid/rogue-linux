steps:
  - |
    echo "[COGMAN] Extracting libunistring source, sir."
    tar -xf tar/libunistring-1.1.tar.gz -C source --strip-components=1

  - |
    echo "[COGMAN] Configuring libunistring, sir."
    cd build
    ../source/configure \
      --prefix=/usr \
      --disable-static

  - |
    echo "[COGMAN] Building libunistring, sir."
    cd build
    make
