steps:
  - rm -rf source build
  - mkdir -p source build

  - |
      echo "[COGMAN] Extracting libunistring source, sir."
      tar -xf tar/libunistring-1.2.tar.xz -C source

  - |
      echo "[COGMAN] Configuring libunistring, sir."
      cd build
      ../source/libunistring-1.2/configure --prefix=/usr \
        --disable-static

