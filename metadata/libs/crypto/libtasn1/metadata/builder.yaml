steps:
  - rm -rf source build
  - mkdir -p source build

  - |
      echo "[COGMAN] Extracting libtasn1 source, sir."
      tar -xf tar/libtasn1-4.19.0.tar.xz -C source

  - |
      echo "[COGMAN] Configuring libtasn1, sir."
      cd build
      ../source/libtasn1-4.19.0/configure --prefix=/usr \
        --disable-static

