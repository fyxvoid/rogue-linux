steps:
  - rm -rf source build
  - mkdir -p source build

  - |
      echo "[COGMAN] Extracting openssl source, sir."
      tar -xf tar/openssl-3.2.1.tar.xz -C source

  - |
      echo "[COGMAN] Configuring openssl, sir."
      cd build
      ../source/openssl-3.2.1/configure --prefix=/usr \
        --openssldir=/etc/ssl shared zlib-dynamic

