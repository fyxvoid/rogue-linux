steps:
  - rm -rf source build
  - mkdir -p source build

  - |
      echo "[COGMAN] Extracting gnutls source, sir."
      tar -xf tar/gnutls-3.8.3.tar.xz -C source

  - |
      echo "[COGMAN] Configuring gnutls, sir."
      cd build
      ../source/gnutls-3.8.3/configure --prefix=/usr \
        --disable-static \
        --with-default-trust-store-pkcs11=pkcs11:

