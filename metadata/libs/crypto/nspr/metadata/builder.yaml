steps:
  - rm -rf source build
  - mkdir -p source build

  - |
      echo "[COGMAN] Extracting nspr source, sir."
      tar -xf tar/nspr-4.35.tar.xz -C source

  - |
      echo "[COGMAN] Configuring nspr, sir."
      cd build
      ../source/nspr-4.35/configure --prefix=/usr \
        --with-mozilla \
        --with-pthreads \
        --enable-64bit

