steps:
  - rm -rf source build
  - mkdir -p source build

  - |
      echo "[COGMAN] Extracting libssh2 source, sir."
      tar -xf tar/libssh2-1.11.0.tar.xz -C source

  - |
      echo "[COGMAN] Configuring libssh2, sir."
      cd build
      ../source/libssh2-1.11.0/configure --prefix=/usr \
        --disable-static \
        --with-openssl

