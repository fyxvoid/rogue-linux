steps:
  - rm -rf source build
  - mkdir -p source build

  - |
      echo "[COGMAN] Extracting openrc source, sir."
      tar -xf tar/openrc-0.54.tar.xz -C source

  - |
      echo "[COGMAN] Configuring openrc with Meson, sir."
      cd build
      meson setup ../source/openrc-0.54 . --prefix=/usr --buildtype=release

