steps:
  - rm -rf source build
  - mkdir -p source build

  - |
      echo "[COGMAN] Extracting man-db source, sir."
      tar -xf tar/man-db-2.12.0.tar.xz -C source

  - |
      echo "[COGMAN] Configuring man-db, sir."
      cd build
      ../source/man-db-2.12.0/configure --prefix=/usr \
        --sysconfdir=/etc \
        --disable-setuid

