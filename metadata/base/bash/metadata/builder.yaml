steps:
  - rm -rf source build
  - mkdir -p source build

  - |
      echo "[COGMAN] Extracting bash source, sir."
      tar -xf tar/bash-5.2.21.tar.gz -C source

  - |
      echo "[COGMAN] Configuring bash, sir."
      cd build
      ../source/bash-5.2.21/configure --prefix=/usr \
        --without-bash-malloc \
        --with-installed-readline

