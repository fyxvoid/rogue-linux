steps:
  - rm -rf build source
  - mkdir -p build source

  - |
      echo "[COGMAN] Extracting libtirpc source, sir."
      tar -xf tar/libtirpc-1.3.4.tar.bz2 -C source

  - |
      echo "[COGMAN] Configuring libtirpc, sir."
      cd build

      ../source/libtirpc-1.3.4/configure \
        --prefix=/usr \
        --disable-static \
        --disable-gssapi \
        CFLAGS="-std=gnu99 -Wno-error"
