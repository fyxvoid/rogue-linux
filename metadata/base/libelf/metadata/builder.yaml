steps:
  - rm -rf source build
  - mkdir -p source build

  - |
      echo "[COGMAN] Extracting libelf source, sir."
      tar -xf tar/libelf-0.191.tar.xz -C source

  - |
      echo "[COGMAN] Configuring libelf, sir."
      cd build
      ../source/libelf-0.191/configure --prefix=/usr \
        --disable-debuginfod \
        --enable-libdebuginfod=dummy

