steps:
  - rm -rf source build
  - mkdir -p source build

  - |
      echo "[COGMAN] Extracting readline source, sir."
      tar -xf tar/readline-8.2.tar.gz -C source

  - |
      echo "[COGMAN] Configuring readline, sir."
      cd build

      ../source/readline-8.2/configure \
        --prefix=/usr \
        --disable-static
