steps:
  - rm -rf source build
  - mkdir -p source build

  - |
      echo "[COGMAN] Extracting acl source, sir."
      tar -xf tar/acl-2.3.2.tar.xz -C source

  - |
      echo "[COGMAN] Configuring acl, sir."
      cd build
      ../source/acl-2.3.2/configure --prefix=/usr \
        --disable-static

