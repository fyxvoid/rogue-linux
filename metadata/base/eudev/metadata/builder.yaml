steps:
  - rm -rf source build
  - mkdir -p source build

  - |
      echo "[COGMAN] Extracting eudev source, sir."
      tar -xf tar/eudev-3.2.14.tar.xz -C source

  - |
      echo "[COGMAN] Configuring eudev, sir."
      cd build
      ../source/eudev-3.2.14/configure --prefix=/usr \
        --sysconfdir=/etc \
        --enable-manpages \
        --disable-static

