steps:
  - rm -rf source build
  - mkdir -p source build

  - |
      echo "[COGMAN] Extracting diffutils source, sir."
      tar -xf tar/diffutils-3.10.tar.xz -C source

  - |
      echo "[COGMAN] Configuring diffutils, sir."
      cd build
      ../source/diffutils-3.10/configure --prefix=/usr \
        

