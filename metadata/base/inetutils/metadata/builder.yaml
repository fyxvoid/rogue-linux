steps:
  - rm -rf source build
  - mkdir -p source build

  - |
      echo "[COGMAN] Extracting inetutils source, sir."
      tar -xf tar/inetutils-2.5.tar.xz -C source

  - |
      echo "[COGMAN] Configuring inetutils, sir."
      cd build
      ../source/inetutils-2.5/configure --prefix=/usr \
        --bindir=/usr/bin \
        --localstatedir=/var \
        --disable-logger \
        --disable-whois \
        --disable-rcp \
        --disable-rexec \
        --disable-rlogin \
        --disable-rsh \
        --disable-servers

