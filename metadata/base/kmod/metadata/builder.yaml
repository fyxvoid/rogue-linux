steps:
  - rm -rf source build
  - mkdir -p source build

  - |
      echo "[COGMAN] Extracting kmod source, sir."
      tar -xf tar/kmod-32.tar.xz -C source

  - |
      echo "[COGMAN] Configuring kmod, sir."
      cd build
      ../source/kmod-32/configure --prefix=/usr \
        --sysconfdir=/etc \
        --with-openssl

