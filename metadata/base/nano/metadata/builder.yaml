steps:
  - rm -rf source build
  - mkdir -p source build

  - |
      echo "[COGMAN] Extracting nano source, sir."
      tar -xf tar/nano-7.2.tar.xz -C source

  - |
      echo "[COGMAN] Configuring nano, sir."
      cd build
      ../source/nano-7.2/configure --prefix=/usr \
        --sysconfdir=/etc \
        --enable-utf8

