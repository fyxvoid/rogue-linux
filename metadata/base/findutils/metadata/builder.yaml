steps:
  - rm -rf source build
  - mkdir -p source build

  - |
      echo "[COGMAN] Extracting findutils source, sir."
      tar -xf tar/findutils-4.9.0.tar.xz -C source

  - |
      echo "[COGMAN] Configuring findutils, sir."
      cd build
      ../source/findutils-4.9.0/configure --prefix=/usr \
        --localstatedir=/var/lib/locate

