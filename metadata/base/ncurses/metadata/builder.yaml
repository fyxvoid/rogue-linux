steps:
  - rm -rf source build
  - mkdir -p source build

  - |
      echo "[COGMAN] Extracting ncurses source, sir."
      tar -xf tar/ncurses-6.4-20230520.tar.xz -C source

  - |
      echo "[COGMAN] Configuring ncurses, sir."
      cd build
      ../source/ncurses-6.4-20230520/configure --prefix=/usr \
        --with-shared \
        --without-debug \
        --without-normal \
        --with-cxx-shared \
        --enable-pc-files \
        --enable-widec

