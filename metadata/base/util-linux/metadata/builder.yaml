steps:
  - rm -rf source build
  - mkdir -p source build

  - |
      echo "[COGMAN] Extracting util-linux source, sir."
      tar -xf tar/util-linux-2.40.tar.xz -C source

  - |
      echo "[COGMAN] Configuring util-linux, sir."
      cd build
      ../source/util-linux-2.40/configure --prefix=/usr \
        --disable-chfn-chsh \
        --disable-login \
        --disable-nologin \
        --disable-su \
        --disable-setpriv \
        --disable-runuser \
        --disable-pylibmount \
        --disable-static \
        --without-python

