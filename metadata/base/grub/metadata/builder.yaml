steps:
  - rm -rf source build
  - mkdir -p source build

  - |
      echo "[COGMAN] Extracting grub source, sir."
      tar -xf tar/grub-2.12.tar.xz -C source

  - |
      echo "[COGMAN] Configuring grub, sir."
      cd build
      ../source/grub-2.12/configure --prefix=/usr \
        --sysconfdir=/etc \
        --disable-efiemu \
        --disable-werror

