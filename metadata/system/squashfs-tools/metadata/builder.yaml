steps:
  - rm -rf source build
  - mkdir -p source build

  - |
      echo "[COGMAN] Extracting squashfs-tools source, sir."
      tar -xf tar/squashfs-tools-4.6.1.tar.xz -C source

  - |
      echo "[COGMAN] Building squashfs-tools, sir."
      cd source/squashfs-tools-4.6.1
      make -j$(nproc)

