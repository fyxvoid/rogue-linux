steps:
  - rm -rf source build
  - mkdir -p source build

  - |
      echo "[COGMAN] Extracting audit source, sir."
      tar -xf tar/audit-3.1.4.tar.xz -C source

  - |
      echo "[COGMAN] Configuring audit, sir."
      cd build
      ../source/audit-3.1.4/configure --prefix=/usr \
        --sysconfdir=/etc

