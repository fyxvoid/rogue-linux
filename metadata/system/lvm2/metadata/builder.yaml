steps:
  - rm -rf source build
  - mkdir -p source build

  - |
      echo "[COGMAN] Extracting lvm2 source, sir."
      tar -xf tar/lvm2-2.03.23.tar.xz -C source

  - |
      echo "[COGMAN] Configuring lvm2, sir."
      cd build
      ../source/lvm2-2.03.23/configure --prefix=/usr \
        --enable-cmdlib \
        --enable-pkgconfig

