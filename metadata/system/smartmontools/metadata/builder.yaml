steps:
  - rm -rf source build
  - mkdir -p source build

  - |
      echo "[COGMAN] Extracting smartmontools source, sir."
      tar -xf tar/smartmontools-7.4.tar.xz -C source

  - |
      echo "[COGMAN] Configuring smartmontools, sir."
      cd build
      ../source/smartmontools-7.4/configure --prefix=/usr \
        --sysconfdir=/etc

