steps:
  - rm -rf source build
  - mkdir -p source build

  - |
      echo "[COGMAN] Extracting cryptsetup source, sir."
      tar -xf tar/cryptsetup-2.7.0.tar.xz -C source

  - |
      echo "[COGMAN] Configuring cryptsetup, sir."
      cd build
      ../source/cryptsetup-2.7.0/configure --prefix=/usr \
        --disable-ssh-token

