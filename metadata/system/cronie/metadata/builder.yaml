steps:
  - rm -rf source build
  - mkdir -p source build

  - |
      echo "[COGMAN] Extracting cronie source, sir."
      tar -xf tar/cronie-1.7.1.tar.xz -C source

  - |
      echo "[COGMAN] Configuring cronie, sir."
      cd build
      ../source/cronie-1.7.1/configure --prefix=/usr \
        --sysconfdir=/etc

