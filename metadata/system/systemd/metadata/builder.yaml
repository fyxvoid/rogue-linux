steps:
  - rm -rf source build
  - mkdir -p source build

  - |
      echo "[COGMAN] Extracting systemd source, sir."
      tar -xf tar/systemd-255.tar.xz -C source

  - |
      echo "[COGMAN] Configuring systemd with Meson, sir."
      cd build
      meson setup ../source/systemd-255 . --prefix=/usr --buildtype=release -Ddefault-dnssec=no -Dfirstboot=false

