steps:
  - rm -rf source build
  - mkdir -p source build

  - |
      echo "[COGMAN] Extracting polkit source, sir."
      tar -xf tar/polkit-124.tar.xz -C source

  - |
      echo "[COGMAN] Configuring polkit with Meson, sir."
      cd build
      meson setup ../source/polkit-124 . --prefix=/usr --buildtype=release

