steps:
  - rm -rf source build
  - mkdir -p source build

  - |
      echo "[COGMAN] Extracting rsyslog source, sir."
      tar -xf tar/rsyslog-8.2312.0.tar.xz -C source

  - |
      echo "[COGMAN] Configuring rsyslog, sir."
      cd build
      ../source/rsyslog-8.2312.0/configure --prefix=/usr \
        --sysconfdir=/etc

