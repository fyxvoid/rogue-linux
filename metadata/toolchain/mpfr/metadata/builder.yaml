steps:
  - rm -rf source build
  - mkdir -p source build

  - |
      echo "[COGMAN] Extracting mpfr source, sir."
      tar -xf tar/mpfr-4.2.1.tar.xz -C source

  - |
      echo "[COGMAN] Configuring mpfr, sir."
      cd build
      ../source/mpfr-4.2.1/configure --prefix=/usr \
        --enable-thread-safe

