steps:
  - rm -rf source build
  - mkdir -p source build

  - |
      echo "[COGMAN] Extracting gcc source, sir."
      tar -xf tar/gcc-14.1.0.tar.xz -C source

  - |
      echo "[COGMAN] Configuring gcc, sir."
      cd build
      ../source/gcc-14.1.0/configure --prefix=/usr \
        --disable-multilib \
        --disable-nls \
        --enable-languages=c,c++ \
        --enable-default-pie \
        --enable-default-ssp \
        --with-system-zlib

