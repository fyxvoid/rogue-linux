steps:
  - rm -rf source build
  - mkdir -p source build

  - |
      echo "[COGMAN] Extracting GCC source (pass 2), sir."
      tar -xf tar/gcc-14.1.0.tar.xz -C source

  - |
      echo "[COGMAN] Preparing GCC source, sir."
      cd source/gcc-14.1.0
      sed -e '/m64=/s/lib64/lib/' -i.orig gcc/config/i386/t-linux64


  - |
      echo "[COGMAN] Configuring GCC (pass 2), sir."
      cd build

      ../source/gcc-14.1.0/configure \
        --prefix=/usr \
        --disable-multilib \
        --disable-nls \
        --enable-languages=c,c++ \
        --enable-default-pie \
        --enable-default-ssp \
        --with-system-zlib \
        --disable-libitm \
        --disable-libsanitizer
