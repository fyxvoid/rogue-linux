steps:
  - rm -rf source build
  - mkdir -p source build

  - |
      echo "[COGMAN] Extracting linux-headers source, sir."
      tar -xf tar/linux-headers-6.8.2.tar.xz -C source

  - |
      echo "[COGMAN] Building linux-headers, sir."
      cd source/linux-headers-6.8.2
      make -j$(nproc) headers_install INSTALL_HDR_PATH=$PKGROOT/usr

