steps:
  - rm -rf source build
  - mkdir -p source build

  - |
      echo "[COGMAN] Extracting gettext source, sir."
      tar -xf tar/gettext-0.22.5.tar.xz -C source

  - |
      echo "[COGMAN] Configuring gettext, sir."
      cd build
      ../source/gettext-0.22.5/configure --prefix=/usr \
        --disable-static

