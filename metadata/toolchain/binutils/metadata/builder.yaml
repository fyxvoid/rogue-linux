steps:
  - rm -rf source build
  - mkdir -p source build

  - |
      echo "[COGMAN] Extracting binutils source, sir."
      tar -xf tar/binutils-2.42.tar.xz -C source

  - |
      echo "[COGMAN] Configuring binutils, sir."
      cd build
      ../source/binutils-2.42/configure --prefix=/usr \
        --enable-gold \
        --enable-plugins \
        --enable-shared \
        --disable-werror \
        --with-system-zlib

