steps:
  - rm -rf source build
  - mkdir -p source build

  - |
      echo "[COGMAN] Extracting autoconf source, sir."
      tar -xf tar/autoconf-2.72.tar.xz -C source

  - |
      echo "[COGMAN] Configuring autoconf, sir."
      cd build
      ../source/autoconf-2.72/configure --prefix=/usr \
        

