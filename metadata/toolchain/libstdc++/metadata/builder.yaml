steps:
  - rm -rf source build
  - mkdir -p source build

  - |
      echo "[COGMAN] Extracting libstdc++ source, sir."
      tar -xf tar/libstdc++-14.1.0.tar.xz -C source

  - |
      echo "[COGMAN] Configuring libstdc++, sir."
      cd build
      ../source/libstdc++-14.1.0/configure --prefix=/usr

