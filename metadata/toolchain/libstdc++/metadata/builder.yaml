steps:
  - rm -rf source build
  - mkdir -p source build

  - |
      echo "[COGMAN] Extracting GCC source for bootstrap libstdc++, sir."
      tar -xf tar/gcc-14.1.0.tar.xz -C source

  - |
      echo "[COGMAN] Configuring GCC for bootstrap libstdc++, sir."
      cd build

      ../source/gcc-14.1.0/configure \
        --prefix=/usr \
        --disable-multilib \
        --disable-nls \
        --enable-languages=c,c++ \
        --disable-libstdcxx-pch
