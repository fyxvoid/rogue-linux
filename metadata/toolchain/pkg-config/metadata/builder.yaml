steps:
  - rm -rf source build
  - mkdir -p source build

  - |
      echo "[COGMAN] Extracting pkg-config source, sir."
      tar -xf tar/pkg-config-0.29.2.tar.xz -C source

  - |
      echo "[COGMAN] Configuring pkg-config, sir."
      cd build
      ../source/pkg-config-0.29.2/configure --prefix=/usr \
        --with-internal-glib

