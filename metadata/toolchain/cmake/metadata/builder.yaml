steps:
  - rm -rf source build
  - mkdir -p source build

  - |
      echo "[COGMAN] Extracting cmake source, sir."
      tar -xf tar/cmake-3.29.0.tar.xz -C source

  - |
      echo "[COGMAN] Configuring cmake with CMake, sir."
      cd build
      cmake ../source/cmake-3.29.0 -DCMAKE_INSTALL_PREFIX=/usr -DCMAKE_BUILD_TYPE=Release \
        -DCMAKE_USE_SYSTEM_LIBRARIES=ON

