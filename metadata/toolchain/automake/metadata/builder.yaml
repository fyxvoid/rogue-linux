steps:
  - rm -rf source build
  - mkdir -p source build

  - |
      echo "[COGMAN] Extracting automake source, sir."
      tar -xf tar/automake-1.17.tar.xz -C source

  - |
      echo "[COGMAN] Configuring automake, sir."
      cd build
      ../source/automake-1.17/configure --prefix=/usr \
        

