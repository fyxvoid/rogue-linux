install:
  - mkdir -p build-gmp

  - |
      sh -c '
        set -e
        cd build-gmp

        echo "[COGMAN] Configuring GMP with a disciplined environment, sir."

        env -i \
          HOME="$HOME" \
          PATH=/usr/bin:/bin \
          CC=gcc \
          CXX=g++ \
          ABI=64 \
          ../source/gmp-6.3.0/configure \
            --prefix=/tools \
            --enable-cxx \
            --disable-shared \
            --enable-static \
            --disable-assembly
      '

  - |
      sh -c '
        set -e
        echo "[COGMAN] Building GMP, sir."
        make -j1
      '

  - |
      sh -c '
        set -e
        echo "[COGMAN] Installing GMP into pkgroot, sir."
        make install DESTDIR="$PKGROOT"
      '
