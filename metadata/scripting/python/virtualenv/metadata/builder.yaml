steps:
  - rm -rf source build
  - mkdir -p source build

  - |
      echo "[COGMAN] Extracting virtualenv source, sir."
      tar -xf tar/virtualenv-20.25.0.tar.xz -C source

  - |
      echo "[COGMAN] Building virtualenv Python package, sir."
      cd source/virtualenv-20.25.0
      python3 setup.py build

