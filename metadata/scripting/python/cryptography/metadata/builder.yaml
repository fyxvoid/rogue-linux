steps:
  - rm -rf source build
  - mkdir -p source build

  - |
      echo "[COGMAN] Extracting cryptography source, sir."
      tar -xf tar/cryptography-42.0.4.tar.xz -C source

  - |
      echo "[COGMAN] Building cryptography Python package, sir."
      cd source/cryptography-42.0.4
      python3 setup.py build

