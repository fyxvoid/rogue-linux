steps:
  - rm -rf source build
  - mkdir -p source build

  - |
      echo "[COGMAN] Extracting certifi source, sir."
      tar -xf tar/certifi-2024.2.2.tar.xz -C source

  - |
      echo "[COGMAN] Building certifi Python package, sir."
      cd source/certifi-2024.2.2
      python3 setup.py build

