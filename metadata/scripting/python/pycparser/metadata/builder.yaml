steps:
  - rm -rf source build
  - mkdir -p source build

  - |
      echo "[COGMAN] Extracting pycparser source, sir."
      tar -xf tar/pycparser-2.21.tar.xz -C source

  - |
      echo "[COGMAN] Building pycparser Python package, sir."
      cd source/pycparser-2.21
      python3 setup.py build

