steps:
  - rm -rf source build
  - mkdir -p source build

  - |
      echo "[COGMAN] Extracting impacket source, sir."
      tar -xf tar/impacket-0.11.0.tar.xz -C source

  - |
      echo "[COGMAN] Building impacket Python package, sir."
      cd source/impacket-0.11.0
      python3 setup.py build

