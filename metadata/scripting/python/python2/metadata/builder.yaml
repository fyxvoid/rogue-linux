steps:
  - rm -rf source build
  - mkdir -p source build

  - |
      echo "[COGMAN] Extracting python2 source, sir."
      tar -xf tar/python2-2.7.18.tar.xz -C source

  - |
      echo "[COGMAN] Configuring python2, sir."
      cd build
      ../source/python2-2.7.18/configure --prefix=/usr \
        --enable-shared \
        --with-system-expat \
        --with-system-ffi \
        --enable-unicode=ucs4

