steps:
  - rm -rf source build
  - mkdir -p source build

  - |
      echo "[COGMAN] Extracting setuptools source, sir."
      tar -xf tar/setuptools-69.1.0.tar.xz -C source

  - |
      echo "[COGMAN] Building setuptools Python package, sir."
      cd source/setuptools-69.1.0
      python3 setup.py build

