steps:
  - rm -rf source build
  - mkdir -p source build

  - |
      echo "[COGMAN] Extracting tcl source, sir."
      tar -xf tar/tcl-8.6.14.tar.xz -C source

  - |
      echo "[COGMAN] Configuring tcl, sir."
      cd build
      ../source/tcl-8.6.14/configure --prefix=/usr \
        --enable-threads \
        --enable-64bit

