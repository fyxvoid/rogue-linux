steps:
  - rm -rf source build
  - mkdir -p source build

  - |
      echo "[COGMAN] Extracting nodejs source, sir."
      tar -xf tar/nodejs-20.11.1.tar.xz -C source

  - |
      echo "[COGMAN] Configuring nodejs, sir."
      cd build
      ../source/nodejs-20.11.1/configure --prefix=/usr \
        --shared-openssl \
        --shared-zlib \
        --with-intl=system-icu

